<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Day 9 · The Candy Cane Lane Music Box · Candy Cane Lane</title>

<style>
:root{--cran:#8C1530;--red:#D6243A;--mint:#5FD6B3;--mintsoft:#DDF6EC;--mintdeep:#2E9C7E;--pink:#F7A8C4;--pinksoft:#FDE3EC;--ivory:#FFF8EC;--gold:#D9A94A;--ink:#4A2230}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--ink);font-family:Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(circle at 12% 18%,rgba(247,168,196,.25) 0 2px,transparent 3px) 0 0/46px 46px,radial-gradient(circle at 70% 60%,rgba(95,214,179,.22) 0 2px,transparent 3px) 0 0/58px 58px,var(--ivory)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 28px);box-shadow:0 2px 0 var(--pink)}
header{display:flex;align-items:center;gap:12px;max-width:1120px;margin:0 auto;padding:12px 16px 6px}
h1{flex:1;margin:0;text-align:center;color:var(--cran);font-weight:normal;font-size:clamp(20px,3.4vw,32px);line-height:1.15}
h1 small{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mintdeep);margin-bottom:3px}
.spacer{width:44px;flex:none}
.back{display:inline-flex;min-width:44px;justify-content:center;align-items:center;gap:6px;border:2px solid var(--cran);background:#fff;color:var(--cran);border-radius:999px;padding:9px 14px;font-size:15px;min-height:44px;white-space:nowrap}
.back:hover{background:var(--pinksoft)}
[hidden]{display:none !important}
.make{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:12px 28px;font-size:20px;color:#fff;background:linear-gradient(var(--red),var(--cran));box-shadow:0 5px 0 #5e0d20,0 10px 18px rgba(140,21,48,.3);min-height:58px}
.make:active{transform:translateY(3px);box-shadow:0 2px 0 #5e0d20}
.make.gold{color:#4A2230;background:linear-gradient(#F3C969,#C48A2C);box-shadow:0 5px 0 #8A5E1C,0 10px 18px rgba(169,119,42,.35)}
.make[disabled]{opacity:.5;cursor:default}
.small{min-height:48px;border-radius:999px;border:2px solid var(--cran);background:#fff;color:var(--cran);font-size:16px;padding:0 18px}
.small:hover{background:var(--pinksoft)}
.modal{position:fixed;inset:0;background:rgba(74,34,48,.5);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal.on{display:flex}
.modal .mcard{background:#fff;border-radius:20px;padding:22px;max-width:380px;text-align:center;box-shadow:0 0 0 4px var(--pink)}
.modal h2{color:var(--cran);font-weight:normal;margin:0 0 8px}
.modal button{min-height:48px;border-radius:999px;border:none;background:var(--cran);color:#fff;font-size:17px;padding:0 30px;margin-top:8px}
@media (max-width:820px){.back span{display:none}.back{padding:9px 12px}header{padding:10px 10px 4px}}


.wrap{max-width:clamp(560px,calc((100vh - 360px) * 1.92 + 28px),1000px);margin:0 auto;padding:8px 14px 30px}
.stage{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink),0 0 0 10px var(--gold),0 18px 36px rgba(140,21,48,.2);background:#FDE3EC;touch-action:manipulation}
.stage svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.bell{cursor:pointer;transform-box:fill-box;transform-origin:50% 0}
.bell:focus{outline:none}
.bell:focus-visible .bodyp{stroke:#fff;stroke-width:5}
.bell.ring{animation:swing .9s ease-out}
@keyframes swing{0%{transform:rotate(0)}15%{transform:rotate(7deg)}35%{transform:rotate(-5deg)}55%{transform:rotate(3deg)}75%{transform:rotate(-1.5deg)}100%{transform:rotate(0)}}
.glow{opacity:0;transition:opacity .2s}
.bell.next .glow{opacity:1;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.bell.lit .glow{opacity:1}
#drum{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%}
#drum.hit{animation:thump .25s ease-out}
@keyframes thump{0%{transform:scale(1)}40%{transform:scale(1.06,.94)}100%{transform:scale(1)}}
.note{animation:floatUp 1.3s ease-out forwards}
@keyframes floatUp{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),-120px) scale(1.1);opacity:0}}
.panel{margin-top:16px;background:#fff;border-radius:24px;padding:16px;text-align:center;box-shadow:0 0 0 3px var(--mintsoft),0 10px 24px rgba(46,156,126,.15)}
.modes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:12px}
.mode{min-height:52px;border-radius:999px;border:none;background:var(--ivory);color:var(--cran);font-size:16px;padding:0 18px;box-shadow:0 0 0 2px var(--pink)}
.mode[aria-pressed="true"]{background:var(--cran);color:#fff;box-shadow:0 0 0 2px var(--cran),0 4px 10px rgba(140,21,48,.25)}
#lyrics{min-height:64px;font-size:clamp(18px,2.8vw,24px);line-height:1.6;color:#9a7b84;margin:4px 0 12px}
#lyrics span{padding:0 1px;border-radius:6px;transition:color .2s,background .2s}
#lyrics span.done{color:var(--mintdeep)}
#lyrics span.now{color:#fff;background:var(--cran);padding:0 5px}
#msg{font-size:17px;font-style:italic;margin:0 0 12px;color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
@media (max-width:560px){.stage{border-radius:18px}.wrap{padding:6px 10px 24px}.mode{font-size:14px;min-height:48px;padding:0 12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}

</style>
</head>
<body>
<div class="stripe"></div>
<header>

<div class="wrap">
  <div class="stage">
  <svg id="scene" viewBox="0 0 1000 520" role="group" aria-label="The Candy Cane Lane music box with eight candy bells and Captain Pinewhistle's drum">
    <defs>
      <pattern id="pWall" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#FFF3E6"/><rect width="22" height="60" fill="#FBD3E0"/><rect x="22" width="3" height="60" fill="#F5B8CC"/><circle cx="42" cy="30" r="3" fill="#F7C64F" opacity=".5"/></pattern>
      <pattern id="pCane" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)"><rect width="30" height="30" fill="#FFF8EC"/><rect width="13" height="30" fill="#D6243A"/></pattern>
      <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8DF94"/><stop offset=".5" stop-color="#D9A94A"/><stop offset="1" stop-color="#A9772A"/></linearGradient>

      <linearGradient id="gBellShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A2230" stop-opacity=".3"/><stop offset=".28" stop-color="#fff" stop-opacity=".45"/><stop offset=".45" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#4A2230" stop-opacity=".35"/></linearGradient>
      <linearGradient id="gBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8EC"/><stop offset="1" stop-color="#F1DEC2"/></linearGradient>
      <radialGradient id="gGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".95"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
      <filter id="fSoft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#8C1530" flood-opacity=".22"/></filter>
      <symbol id="noteSym" viewBox="0 0 30 40"><path d="M10 30 V4 L26 0 V24" stroke="#8C1530" stroke-width="3" fill="none"/><ellipse cx="6" cy="31" rx="6" ry="4.5" fill="#8C1530"/><ellipse cx="22" cy="26" rx="6" ry="4.5" fill="#8C1530"/></symbol>
    </defs>
    <rect id="wall" width="1000" height="1000" fill="url(#pWall)"/>

      <rect x="40" y="436" width="760" height="18" fill="url(#pCane)" stroke="#8C1530" stroke-width="1.5"/>
      <g fill="none" stroke="#D9A94A" stroke-width="3"><rect x="70" y="464" width="200" height="28" rx="10"/><rect x="320" y="464" width="200" height="28" rx="10"/><rect x="570" y="464" width="200" height="28" rx="10"/></g>
      <circle cx="420" cy="478" r="8" fill="url(#gGold)"/>
    </g>
    <!-- candy cane bar the bells hang from -->
    <path d="M40 120 V86 Q40 56 70 56 H790 Q820 56 820 86 V120" fill="none" stroke="#8C1530" stroke-width="22" stroke-linecap="round"/>
    <path d="M40 120 V86 Q40 56 70 56 H790 Q820 56 820 86 V120" fill="none" stroke="url(#pCane)" stroke-width="16" stroke-linecap="round"/>
    <path d="M40 404 V120 M820 404 V120" stroke="url(#gGold)" stroke-width="12" stroke-linecap="round"/>
    </g>

      <rect x="20" y="900" width="960" height="90" rx="16" fill="url(#gBox)" stroke="#A9772A" stroke-width="3" filter="url(#fSoft)"/>
      <rect x="20" y="900" width="960" height="16" rx="8" fill="url(#gGoldH)"/>
      <rect x="40" y="930" width="920" height="18" fill="url(#pCane)" stroke="#8C1530" stroke-width="1.5"/>
      <path d="M40 900 V60 M960 900 V60" stroke="url(#gGold)" stroke-width="12" stroke-linecap="round"/>
      <path d="M40 60 H960 M40 500 H960" stroke="#8C1530" stroke-width="22" stroke-linecap="round"/>
      <path d="M40 60 H960 M40 500 H960" stroke="url(#pCane)" stroke-width="16" stroke-linecap="round"/>
    </g>
    <g id="bells"></g>
    <g id="capDrum">
    <ellipse cx="912" cy="502" rx="70" ry="9" fill="#8C1530" opacity=".18"/>
    <image href="../day-22/assets/captain.webp" x="862" y="150" width="96" height="344"/>
    <g id="drum" tabindex="0" role="button" aria-label="Captain's drum">
      <ellipse cx="914" cy="500" rx="40" ry="10" fill="#8C1530" opacity=".2"/>
      <rect x="878" y="436" width="72" height="58" rx="6" fill="#FFF8EC" stroke="#8C1530" stroke-width="3"/>
      <path d="M878 446 L914 484 L950 446 M878 484 L914 446 L950 484" stroke="#E2B04E" stroke-width="2.5" fill="none"/>
      <rect x="876" y="430" width="76" height="12" rx="4" fill="url(#pCane)" stroke="#8C1530" stroke-width="2"/>
      <rect x="876" y="488" width="76" height="10" rx="4" fill="url(#pCane)" stroke="#8C1530" stroke-width="2"/>
      <ellipse cx="914" cy="432" rx="38" ry="8" fill="#FFFDF6" stroke="#8C1530" stroke-width="2"/>
    </g>
    </g>
    <g id="fx" pointer-events="none"></g>
  </svg>
  </div>

  <section class="panel">
    <div class="modes" role="group" aria-label="Choose what to play">
      <button class="mode" data-song="free" aria-pressed="true">Free play</button>
      <button class="mode" data-song="jingle" aria-pressed="false">Jingle Bells</button>
      <button class="mode" data-song="deck" aria-pressed="false">Deck the Halls</button>

      <button class="small" id="restartBtn" hidden>Start the song again</button>

</div>

<div class="modal" id="backModal" role="dialog" aria-modal="true">
  <div class="mcard">

    <p>Your Sweet Shop is still open in your other tab. Close this tab to go back to it.</p>
    <button id="backOk">OK</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ===== Safe return link (same rules as the other days) ===== */
const SHOP_URL = "";
const ALLOWED_RETURN_HOSTS = ["canva.site", "canva.com", "canva.link"];
const RETURN_KEY = "candycanelane-return-url";
function validReturnUrl(raw){
  try{
    if(!raw || raw.length>500) return null;
    const u = new URL(raw);
    if(u.protocol!=="https:" || u.username || u.password) return null;
    const h = u.hostname.toLowerCase();
    if(!ALLOWED_RETURN_HOSTS.some(a => h===a || h.endsWith("."+a))) return null;
    return u.href;
  }catch(e){ return null; }
}
function readParam(name){
  try{
    const q = new URLSearchParams(location.search).get(name);
    if(q) return q;
    return new URLSearchParams(location.hash.replace(/^#/,"")).get(name);
  }catch(e){ return null; }
}
function resolveReturnUrl(){
  const fromLink = validReturnUrl(readParam("return"));
  if(fromLink){ try{ localStorage.setItem(RETURN_KEY, fromLink); }catch(e){} return fromLink; }
  let fromRef = null;
  try{ if(document.referrer) fromRef = validReturnUrl(new URL(document.referrer).origin + "/"); }catch(e){}
  if(fromRef){ try{ if(!localStorage.getItem(RETURN_KEY)) localStorage.setItem(RETURN_KEY, fromRef); }catch(e){} }
  let remembered = null;
  try{ remembered = validReturnUrl(localStorage.getItem(RETURN_KEY)); }catch(e){}
  return remembered || fromRef || validReturnUrl(SHOP_URL);
}
const RETURN_URL = resolveReturnUrl();
const $ = id => document.getElementById(id);
$("backBtn").onclick = () => {
  if((window.opener||document.referrer)&&history.length<=1){ try{ window.close(); }catch(e){} setTimeout(function(){ if(RETURN_URL){ window.location.assign(RETURN_URL); } else { $("backModal").classList.add("on"); } },400); return; } if(RETURN_URL){ location.assign(RETURN_URL); return; }
  if(window.opener){ try{ window.close(); }catch(e){} }
  $("backModal").classList.add("on");
};
$("backOk").onclick = () => $("backModal").classList.remove("on");



const NS="http://www.w3.org/2000/svg";
function el(t,a,p){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; }
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const NOTES = [["G",392.00],["A",440.00],["B",493.88],["C",523.25],["D",587.33],["E",659.25],["F",698.46],["G",783.99]];
const COLS = [["#B3122E","#7E0B20"],["#E0305A","#9E1838"],["#F59AC0","#C4477A"],["#F3C969","#A9772A"],["#5FD6B3","#2E9C7E"],["#7FE6C6","#2E9C7E"],["#C79BE0","#7A4BA0"],["#FFF3DE","#A9772A"]];
let bells = [], narrow = null;
function buildBells(){
  $("bells").innerHTML = ""; bells = [];
NOTES.forEach((n,i) => {
  let cx, w, h, top, bar;
  if(narrow){ cx = 150 + (i%4)*233; w = 176 - i*6; h = w*1.25; bar = i<4 ? 60 : 500; top = bar + 50 + (i%4)*6; }
  else { cx = 104 + i*92; w = 84 - i*3; h = w*1.5; bar = 120; top = 150 + i*5; }
  const g = el("g",{class:"bell",tabindex:0,role:"button","aria-label":`Bell ${i+1}, note ${n[0]}`, "data-i":i},$("bells"));
  el("path",{d:`M${cx} ${bar} V${top}`,stroke:"#F59AC0","stroke-width":5},g);
  el("circle",{cx,cy:top+4,r:8,fill:"none",stroke:"url(#gGold)","stroke-width":5},g);
  el("circle",{class:"glow",cx,cy:top+h*0.55,r:w*0.95,fill:"url(#gGlow)"},g);
  const y0 = top+10;
  const d = `M${cx-w*.2} ${y0} C${cx-w*.24} ${y0+h*.18} ${cx-w*.38} ${y0+h*.28} ${cx-w*.4} ${y0+h*.56} C${cx-w*.42} ${y0+h*.76} ${cx-w*.5} ${y0+h*.84} ${cx-w*.54} ${y0+h*.92} L${cx+w*.54} ${y0+h*.92} C${cx+w*.5} ${y0+h*.84} ${cx+w*.42} ${y0+h*.76} ${cx+w*.4} ${y0+h*.56} C${cx+w*.38} ${y0+h*.28} ${cx+w*.24} ${y0+h*.18} ${cx+w*.2} ${y0} Z`;
  el("path",{class:"bodyp",d,fill:COLS[i][0],stroke:COLS[i][1],"stroke-width":3,"stroke-linejoin":"round"},g);
  el("path",{d,fill:"url(#gBellShade)","pointer-events":"none"},g);
  el("rect",{x:cx-w*.47,y:y0+h*.72,width:w*.94,height:h*.08,rx:3,fill:"url(#gGoldH)","pointer-events":"none"},g);
  el("ellipse",{cx,cy:y0+h*.92,rx:w*.54,ry:h*.07,fill:COLS[i][1],"pointer-events":"none"},g);
  el("circle",{cx,cy:y0+h*1.0,r:w*.1,fill:"url(#gGold)",stroke:"#A9772A","stroke-width":2,"pointer-events":"none"},g);
  // little bow
  el("path",{d:`M${cx} ${y0} c-10 -12 -24 -8 -20 2 c3 8 14 6 20 -2 z M${cx} ${y0} c10 -12 24 -8 20 2 c-3 8 -14 6 -20 -2 z`,fill:"#F59AC0",stroke:"#C4477A","stroke-width":1.5,"pointer-events":"none"},g);
  bells.push(g);
  g.addEventListener("pointerdown", e => { e.preventDefault(); ring(i); });
  g.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); ring(i); } });
});
}
function applyLayout(){
  const n = window.innerWidth < 640;
  if(n === narrow) return; narrow = n;
  $("scene").setAttribute("viewBox", n ? "0 0 1000 1000" : "0 0 1000 520");
  $("wideDeco").setAttribute("display", n ? "none" : "inline"); $("capDrum").setAttribute("display", n ? "none" : "inline");
  $("narrowDeco").setAttribute("display", n ? "inline" : "none"); $("drumBtn").hidden = !n;
  buildBells(); if(typeof markNext === "function" && SONGS) markNext();
}

// Sound: a soft synthesised bell (no audio files)
let AC = null;
function ac(){ if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); } if(AC.state==="suspended") AC.resume(); return AC; }
function bellTone(f){
  const a = ac(); if(!a) return; const t = a.currentTime;
  const master = a.createGain(); master.gain.value = .32; master.connect(a.destination);
  [[1,1,1.8],[2,.32,1.0],[2.76,.18,.7],[5.4,.06,.35]].forEach(([m,v,dur]) => {
    const o = a.createOscillator(), g = a.createGain(); o.type = "sine"; o.frequency.value = f*m;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.006); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
  });
}
function drumHit(){
  const a = ac(); if(!a) return; const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain(); o.type="sine"; o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(70,t+.18);
  g.gain.setValueAtTime(.7,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.32);
  const n=a.sampleRate*.12, b=a.createBuffer(1,n,a.sampleRate), dd=b.getChannelData(0); for(let i=0;i<n;i++) dd[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1800; const gg=a.createGain(); gg.gain.value=.25; s.connect(f); f.connect(gg); gg.connect(a.destination); s.start(t);
}
function floatNote(x,y){
  const g = el("g",{transform:`translate(${x-12} ${y})`},$("fx"));
  el("use",{href:"#noteSym",width:24,height:32,class:"note",style:`--dx:${(Math.random()-.5)*60}px`},g); setTimeout(()=>g.remove(),1400);
}
function ring(i, fromSong){
  const b = bells[i]; bellTone(NOTES[i][1]);
  b.classList.remove("ring"); void b.getBBox(); b.classList.add("ring");
  const bb = b.getBBox(); if(!REDUCED) floatNote(bb.x+bb.width/2, bb.y+10);
  if(!fromSong) onPlayerNote(i);
}

/* ===== Carols (traditional, public domain). Notes: 0=G 1=A 2=B 3=C 4=D 5=E 6=F 7=G(high) ===== */
const N = {G:0,A:1,B:2,C:3,D:4,E:5,F:6,g:7};
function song(str){ const out=[]; str.trim().split("\n").forEach((line,li) => line.trim().split(/\s+/).forEach(tok => { const [syl,n,d] = tok.split("|"); out.push({syl, n:N[n], d:+(d||1), line:li}); })); return out; }
const SONGS = {
  jingle: {name:"Jingle Bells", tempo:.42, notes: song(`
    Jin-|E gle|E bells,|E|2 jin-|E gle|E bells,|E|2 jin-|E gle|g all|C|1.5 the|D|.5 way!|E|4
    Oh|F what|F fun|F|1.5 it|F|.5 is|F to|E ride|E in|E|.5 a|E|.5 one-|E horse|D o-|D pen|E sleigh,|D|2 hey!|g|2
    Jin-|E gle|E bells,|E|2 jin-|E gle|E bells,|E|2 jin-|E gle|g all|C|1.5 the|D|.5 way!|E|4
    Oh|F what|F fun|F|1.5 it|F|.5 is|F to|E ride|E in|E|.5 a|E|.5 one-|g horse|g o-|F pen|D sleigh!|C|4`)},
  deck: {name:"Deck the Halls", tempo:.45, notes: song(`
    Deck|g|1.5 the|F|.5 halls|E with|D boughs|C of|D hol-|E ly,|C fa|D|.5 la|E|.5 la|F|.5 la|D|.5 la,|E|1.5 la|D|.5 la|C la|B la!|C|2

};
let mode = "free", pos = 0, listening = false, listenTimer = null;
function renderLyrics(){
  const L = $("lyrics"); L.innerHTML = "";
  if(mode === "free") return;
  const notes = SONGS[mode].notes, line = notes[Math.min(pos, notes.length-1)].line;
  notes.forEach((nt,k) => { if(nt.line !== line) return; const s = document.createElement("span"); s.dataset.k = k; s.textContent = nt.syl + (/-$/.test(nt.syl) ? "" : " "); s.className = k<pos ? "done" : k===pos ? "now" : ""; L.appendChild(s); });
  if(pos >= notes.length) L.innerHTML = "";
}
function markNext(){ bells.forEach(b => b.classList.remove("next")); if(mode!=="free" && pos < SONGS[mode].notes.length && !listening) bells[SONGS[mode].notes[pos].n].classList.add("next"); }
function setMode(m){
  stopListen(); mode = m; pos = 0;
  document.querySelectorAll(".mode").forEach(b => b.setAttribute("aria-pressed", b.dataset.song===m ? "true":"false"));
  $("listenBtn").hidden = m==="free"; $("restartBtn").hidden = m==="free";
  $("msg").textContent = m==="free" ? "Tap the candy bells to make music! Tap Captain’s drum for a rum-pum-pum." : `Let’s play “${SONGS[m].name}”! Tap the bell that’s glowing.`;
  renderLyrics(); markNext();
}
function onPlayerNote(i){
  if(mode==="free" || listening) return;
  const S = SONGS[mode]; if(pos >= S.notes.length) return;
  if(S.notes[pos].n === i){ pos++; renderLyrics(); markNext();
    if(pos >= S.notes.length){ $("msg").textContent = `Bravo! You played “${S.name}”! Captain says that was magnificent!`; celebrate(); }
  }
}
function celebrate(){ for(let k=0;k<8;k++) setTimeout(()=>{ const b=bells[k], bb=b.getBBox(); floatNote(bb.x+bb.width/2, bb.y); }, k*80); setTimeout(drumHit, 200); setTimeout(drumHit, 450); }
function stopListen(){ listening = false; clearTimeout(listenTimer); bells.forEach(b=>b.classList.remove("lit")); $("listenBtn").innerHTML = "&#9835; Listen first"; }
function listen(){
  if(listening){ stopListen(); markNext(); return; }
  listening = true; $("listenBtn").textContent = "Stop"; bells.forEach(b=>b.classList.remove("next"));
  const S = SONGS[mode]; let k = 0;
  const stepNote = () => {
    if(!listening) return;
    bells.forEach(b=>b.classList.remove("lit"));
    if(k >= S.notes.length){ stopListen(); pos = 0; renderLyrics(); markNext(); $("msg").textContent = "Now it’s your turn! Tap the glowing bells."; return; }
    const nt = S.notes[k]; bells[nt.n].classList.add("lit"); ring(nt.n, true);
    pos = k; renderLyrics(); pos = 0;
    k++; listenTimer = setTimeout(stepNote, nt.d * S.tempo * 1000);
  };
  stepNote();
}
document.querySelectorAll(".mode").forEach(b => b.onclick = () => setMode(b.dataset.song));
$("listenBtn").onclick = listen;
$("restartBtn").onclick = () => setMode(mode);
$("drumBtn").addEventListener("pointerdown", e => { e.preventDefault(); drumHit(); }); $("drumBtn").addEventListener("click", e => { if(e.detail===0) drumHit(); });
const KEYS = "12345678";
document.addEventListener("keydown", e => { if(e.target.closest && e.target.closest("button,[role=button]") && (e.key==="Enter"||e.key===" ")) return; const k = KEYS.indexOf(e.key); if(k>=0){ ring(k); } });
const drum = $("drum");
const hitDrum = () => { drumHit(); drum.classList.remove("hit"); void drum.getBBox(); drum.classList.add("hit"); };
drum.addEventListener("pointerdown", e => { e.preventDefault(); hitDrum(); });
drum.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); hitDrum(); } });
applyLayout(); window.addEventListener("resize", applyLayout);
setMode("free");
window.__d9 = {SONGS, ring, setMode, listen, get pos(){ return pos; }, get mode(){ return mode; }};

})();
