<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Day 14 · Build a Snowman · Candy Cane Lane</title>

<style>
:root{--cran:#8C1530;--red:#D6243A;--mint:#5FD6B3;--mintsoft:#DDF6EC;--mintdeep:#2E9C7E;--pink:#F7A8C4;--pinksoft:#FDE3EC;--ivory:#FFF8EC;--gold:#D9A94A;--ink:#4A2230}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--ink);font-family:Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(circle at 12% 18%,rgba(247,168,196,.25) 0 2px,transparent 3px) 0 0/46px 46px,radial-gradient(circle at 70% 60%,rgba(95,214,179,.22) 0 2px,transparent 3px) 0 0/58px 58px,var(--ivory)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 28px);box-shadow:0 2px 0 var(--pink)}
header{display:flex;align-items:center;gap:12px;max-width:1120px;margin:0 auto;padding:12px 16px 6px}
h1{flex:1;margin:0;text-align:center;color:var(--cran);font-weight:normal;font-size:clamp(20px,3.4vw,32px);line-height:1.15}
h1 small{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mintdeep);margin-bottom:3px}
.spacer{width:44px;flex:none}
.back{display:inline-flex;min-width:44px;justify-content:center;align-items:center;gap:6px;border:2px solid var(--cran);background:#fff;color:var(--cran);border-radius:999px;padding:9px 14px;font-size:15px;min-height:44px;white-space:nowrap}
.back:hover{background:var(--pinksoft)}
[hidden]{display:none !important}
.make{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:12px 28px;font-size:20px;color:#fff;background:linear-gradient(var(--red),var(--cran));box-shadow:0 5px 0 #5e0d20,0 10px 18px rgba(140,21,48,.3);min-height:58px}
.make:active{transform:translateY(3px);box-shadow:0 2px 0 #5e0d20}
.make.gold{color:#4A2230;background:linear-gradient(#F3C969,#C48A2C);box-shadow:0 5px 0 #8A5E1C,0 10px 18px rgba(169,119,42,.35)}
.make[disabled]{opacity:.5;cursor:default}
.small{min-height:48px;border-radius:999px;border:2px solid var(--cran);background:#fff;color:var(--cran);font-size:16px;padding:0 18px}
.small:hover{background:var(--pinksoft)}
.modal{position:fixed;inset:0;background:rgba(74,34,48,.5);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal.on{display:flex}
.modal .mcard{background:#fff;border-radius:20px;padding:22px;max-width:380px;text-align:center;box-shadow:0 0 0 4px var(--pink)}
.modal h2{color:var(--cran);font-weight:normal;margin:0 0 8px}
.modal button{min-height:48px;border-radius:999px;border:none;background:var(--cran);color:#fff;font-size:17px;padding:0 30px;margin-top:8px}
@media (max-width:820px){.back span{display:none}.back{padding:9px 12px}header{padding:10px 10px 4px}}


.wrap{max-width:1100px;margin:0 auto;padding:6px 14px 30px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.85fr);gap:20px;align-items:start}
.stage{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink),0 0 0 10px var(--gold),0 18px 36px rgba(140,21,48,.22);background:#3B2D66}
.stage svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.bubble{position:absolute;left:50%;top:5%;transform:translateX(-50%) scale(.6);opacity:0;background:#fff;border-radius:20px;padding:10px 16px;max-width:70%;text-align:center;font-style:italic;color:var(--cran);font-size:clamp(14px,2vw,19px);box-shadow:0 0 0 3px var(--pinksoft),0 0 0 5px var(--gold),0 10px 20px rgba(0,0,0,.2);transition:transform .4s cubic-bezier(.2,1.5,.4,1),opacity .3s}
.bubble.on{transform:translateX(-50%) scale(1);opacity:1}
.panel{background:#fff;border-radius:24px;padding:14px;box-shadow:0 0 0 3px var(--mintsoft),0 10px 24px rgba(46,156,126,.15)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{flex:1 1 auto;min-height:44px;border-radius:999px;border:none;background:var(--ivory);color:var(--cran);font-size:15px;padding:0 12px;box-shadow:0 0 0 2px var(--pink)}
.tab[aria-selected="true"]{background:var(--cran);color:#fff;box-shadow:0 0 0 2px var(--cran)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{border:none;border-radius:18px;background:linear-gradient(#FFFDF8,#F6EEF6);padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--ink);box-shadow:0 0 0 2px #EED7E0;min-height:104px}
.opt:hover{box-shadow:0 0 0 2px var(--pink)}
.opt[aria-pressed="true"]{box-shadow:0 0 0 3px var(--cran),0 6px 14px rgba(140,21,48,.18);background:#FFF3F7}
.opt svg{width:76px;height:76px}
.acts{display:grid;gap:10px;margin-top:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{width:100%}
.alive{width:100%;font-size:21px;min-height:62px}
label.name{display:block;font-size:14px;color:var(--cran);margin:4px 0}
#nameIn{width:100%;min-height:46px;border-radius:14px;border:2px solid var(--pink);padding:8px 12px;font:inherit;font-size:17px;color:var(--cran);background:var(--ivory)}
#nameIn:focus{outline:none;border-color:var(--gold)}
#snowman .arm{transform-box:view-box}
#armR{transform-origin:600px 350px}#armL{transform-origin:400px 350px}
#snowman.alive #armR{animation:wave .7s ease-in-out 4 alternate}
#snowman.alive #armL{animation:waveL 1.4s ease-in-out 2 alternate}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(-34deg)}}
@keyframes waveL{from{transform:rotate(0)}to{transform:rotate(14deg)}}
#body{transform-box:view-box;transform-origin:500px 640px}
#snowman.alive #body{animation:bounce .9s cubic-bezier(.3,1.6,.5,1) 3}
@keyframes bounce{0%,100%{transform:scale(1,1)}30%{transform:scale(1.04,.95)}60%{transform:translateY(-26px) scale(.98,1.03)}}
#headG{transform-box:view-box;transform-origin:500px 300px}
#snowman.alive #headG{animation:tilt 1.4s ease-in-out 2 alternate}
@keyframes tilt{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
#eyes{transform-box:fill-box;transform-origin:50% 50%}
#snowman.alive #eyes{animation:blink 1.8s ease-in-out 2}
@keyframes blink{0%,40%,50%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}
.flake{animation:drift linear infinite}
@keyframes drift{from{transform:translateY(-40px)}to{transform:translateY(720px)}}
.spark{animation:burst 1.2s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
@media (max-width:860px){.wrap{grid-template-columns:1fr;padding:4px 10px 24px;gap:14px}.opts{grid-template-columns:repeat(3,minmax(0,1fr))}.opt svg{width:64px;height:64px}.opt{min-height:92px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition-duration:.01ms !important}}

</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <button class="back" id="backBtn" aria-label="Back to the Sweet Shop">&#8592; <span>Back to the Sweet Shop</span></button>
  <h1><small>Day 14 &middot; Candy Cane Lane</small>Build a Snowman on Candy Cane Lane</h1>
  <div class="spacer"></div>
</header>

<div class="wrap">
  <div>
  <div class="stage" id="stage">
    <svg id="scene" viewBox="0 0 1000 700" role="img" aria-label="Your snowman on snowy Candy Cane Lane">
      <defs>
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2259"/><stop offset=".45" stop-color="#6B4A8E"/><stop offset=".78" stop-color="#D08CB0"/><stop offset="1" stop-color="#F7C9D8"/></linearGradient>
        <radialGradient id="gMoon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF8E2"/><stop offset=".5" stop-color="#FFE9B0" stop-opacity=".45"/><stop offset="1" stop-color="#FFE9B0" stop-opacity="0"/></radialGradient>
        <radialGradient id="gBall" cx=".36" cy=".3" r=".78"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F6F3FB"/><stop offset=".85" stop-color="#E2DCF0"/><stop offset="1" stop-color="#C9C0E2"/></radialGradient>
        <radialGradient id="gRim" cx=".5" cy=".5" r=".5"><stop offset=".78" stop-color="#FFD9E8" stop-opacity="0"/><stop offset="1" stop-color="#FFC1D8" stop-opacity=".55"/></radialGradient>
        <linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F7EEF6"/><stop offset="1" stop-color="#E8DAEE"/></linearGradient>
        <linearGradient id="gWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4C9"/><stop offset="1" stop-color="#FFB867"/></linearGradient>
        <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBE6A2"/><stop offset=".5" stop-color="#D9A94A"/><stop offset="1" stop-color="#9C6B22"/></linearGradient>
        <linearGradient id="gGoldH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A9772A"/><stop offset=".35" stop-color="#FBE6A2"/><stop offset=".6" stop-color="#D9A94A"/><stop offset="1" stop-color="#A9772A"/></linearGradient>
        <linearGradient id="gBlack" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E1424"/><stop offset=".35" stop-color="#4A3A52"/><stop offset=".55" stop-color="#2A1E30"/><stop offset="1" stop-color="#140C18"/></linearGradient>
        <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0506A"/><stop offset=".5" stop-color="#C8233F"/><stop offset="1" stop-color="#7E0B20"/></linearGradient>
        <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9F2DF"/><stop offset=".5" stop-color="#5FD6B3"/><stop offset="1" stop-color="#2E9C7E"/></linearGradient>
        <linearGradient id="gPink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD0E2"/><stop offset=".5" stop-color="#F59AC0"/><stop offset="1" stop-color="#C4477A"/></linearGradient>
        <linearGradient id="gCarrot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB25E"/><stop offset="1" stop-color="#E06A1B"/></linearGradient>
        <linearGradient id="gWood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A5536"/><stop offset=".5" stop-color="#B57A4E"/><stop offset="1" stop-color="#6B3F26"/></linearGradient>
        <radialGradient id="gGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".95"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
        <radialGradient id="gCoal" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#6A5A70"/><stop offset="1" stop-color="#1A1220"/></radialGradient>
        <pattern id="pCane" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)"><rect width="24" height="24" fill="#FFF8EC"/><rect width="10" height="24" fill="#D6243A"/></pattern>
        <pattern id="pCaneM" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)"><rect width="24" height="24" fill="#FFF8EC"/><rect width="10" height="24" fill="#3FB894"/></pattern>
        <pattern id="pKnit" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="#5FD6B3"/><path d="M0 0 L7 8 L14 0 M0 6 L7 14 L14 6" stroke="#46C29E" stroke-width="2" fill="none"/></pattern>
        <pattern id="pDots" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#F59AC0"/><circle cx="5" cy="5" r="3" fill="#FFF8EC"/><circle cx="15" cy="15" r="3" fill="#FFF8EC"/></pattern>
        <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
        <filter id="fShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A2860" flood-opacity=".3"/></filter>
        <symbol id="tw" viewBox="-10 -10 20 20"><path d="M0 -10 C1 -3 3 -1 10 0 C3 1 1 3 0 10 C-1 3 -3 1 -10 0 C-3 -1 -1 -3 0 -10 Z" fill="#FFF3C4"/></symbol>
      </defs>
      <g id="world"></g>
      <g id="snowman"></g>
      <g id="flakes" pointer-events="none"></g>
      <g id="fx" pointer-events="none"></g>
    </svg>
    <div class="bubble" id="bubble" aria-live="polite"></div>
  </div>
  </div>
  <section class="panel">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="opts" id="opts" role="group"></div>
    <div class="acts">
      <div class="row2"><button class="small" id="randBtn">&#10024; Surprise me!</button><button class="small" id="resetBtn">Start over</button></div>
      <label class="name" for="nameIn">Give your snowman a name <i>(optional)</i></label>
      <input id="nameIn" type="text" maxlength="18" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="e.g. Frosty Sprinkles">
      <button class="make gold alive" id="aliveBtn">&#10052; Bring him to life!</button>
      <button class="small" id="saveBtn">Save a picture of my snowman</button>
    </div>
  </section>
</div>

<div class="modal" id="backModal" role="dialog" aria-modal="true">
  <div class="mcard">
    <h2>Back to the Sweet Shop</h2>
    <p>Your Sweet Shop is still open in your other tab. Close this tab to go back to it.</p>
    <button id="backOk">OK</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ===== Safe return link (same rules as the other days) ===== */
const SHOP_URL = "";
const ALLOWED_RETURN_HOSTS = ["canva.site", "canva.com", "canva.link"];
const RETURN_KEY = "candycanelane-return-url";
function validReturnUrl(raw){
  try{
    if(!raw || raw.length>500) return null;
    const u = new URL(raw);
    if(u.protocol!=="https:" || u.username || u.password) return null;
    const h = u.hostname.toLowerCase();
    if(!ALLOWED_RETURN_HOSTS.some(a => h===a || h.endsWith("."+a))) return null;
    return u.href;
  }catch(e){ return null; }
}
function readParam(name){
  try{
    const q = new URLSearchParams(location.search).get(name);
    if(q) return q;
    return new URLSearchParams(location.hash.replace(/^#/,"")).get(name);
  }catch(e){ return null; }
}
function resolveReturnUrl(){
  const fromLink = validReturnUrl(readParam("return"));
  if(fromLink){ try{ localStorage.setItem(RETURN_KEY, fromLink); }catch(e){} return fromLink; }
  let fromRef = null;
  try{ if(document.referrer) fromRef = validReturnUrl(new URL(document.referrer).origin + "/"); }catch(e){}
  if(fromRef){ try{ if(!localStorage.getItem(RETURN_KEY)) localStorage.setItem(RETURN_KEY, fromRef); }catch(e){} }
  let remembered = null;
  try{ remembered = validReturnUrl(localStorage.getItem(RETURN_KEY)); }catch(e){}
  return remembered || fromRef || validReturnUrl(SHOP_URL);
}
const RETURN_URL = resolveReturnUrl();
const $ = id => document.getElementById(id);
$("backBtn").onclick = () => {
  if((window.opener||document.referrer)&&history.length<=1){ try{ window.close(); }catch(e){} setTimeout(function(){ if(RETURN_URL){ window.location.assign(RETURN_URL); } else { $("backModal").classList.add("on"); } },400); return; } if(RETURN_URL){ location.assign(RETURN_URL); return; }
  if(window.opener){ try{ window.close(); }catch(e){} }
  $("backModal").classList.add("on");
};
$("backOk").onclick = () => $("backModal").classList.remove("on");



const NS="http://www.w3.org/2000/svg";
const R=(a,b)=>a+Math.random()*(b-a);
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(t,a,p){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; }

/* ===== The world: Candy Cane Lane at twilight ===== */
(function(){
  let s = '<rect width="1000" height="700" fill="url(#gSky)"/>';
  for(let i=0;i<70;i++) s += `<circle cx="${R(0,1000).toFixed(0)}" cy="${R(0,300).toFixed(0)}" r="${R(.6,2).toFixed(1)}" fill="#fff" opacity="${R(.4,1).toFixed(2)}"/>`;
  s += '<circle cx="830" cy="110" r="130" fill="url(#gMoon)"/><circle cx="830" cy="110" r="44" fill="#FFF8E2"/><circle cx="816" cy="100" r="8" fill="#F4E6C0" opacity=".6"/><circle cx="842" cy="124" r="5" fill="#F4E6C0" opacity=".6"/>';
  s += '<path d="M0 420 C 120 390 220 410 330 395 C 460 378 560 404 700 390 C 820 378 920 400 1000 388 V700 H0 Z" fill="#B58BC0" opacity=".45"/>';
  const houses = [[-10,150,170,"#F7A8C4","#8C1530"],[175,130,150,"#BFEBDB","#2E9C7E"],[700,140,160,"#FDE3EC","#8C1530"],[860,150,175,"#9BE8CF","#2E9C7E"]];
  houses.forEach(([x,w,h,c,r]) => { const base=470, top=base-h;
    s += `<g opacity=".95"><rect x="${x}" y="${top}" width="${w}" height="${h}" fill="${c}" stroke="#8C1530" stroke-width="2"/>`;
    s += `<path d="M${x-10} ${top} L${x+w/2} ${top-62} L${x+w+10} ${top} Z" fill="${r}"/><path d="M${x-10} ${top} L${x+w/2} ${top-62} L${x+w+10} ${top}" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>`;
    s += `<rect x="${x}" y="${top+6}" width="${w}" height="12" fill="url(#pCane)"/><rect x="${x-4}" y="${top-3}" width="${w+8}" height="5" fill="url(#gGoldH)"/>`;
    for(let k=0;k<2;k++){ const wx=x+16+k*(w/2); s += `<circle cx="${wx+(w/2-32)/2}" cy="${top+58}" r="34" fill="url(#gGlow)" opacity=".6"/><rect x="${wx}" y="${top+36}" width="${w/2-32}" height="44" rx="9" fill="url(#gWin)" stroke="#FFF8EC" stroke-width="4"/>`; }
    s += `<rect x="${x+w/2-15}" y="${base-58}" width="30" height="58" rx="13" fill="#8C1530" stroke="#FFF8EC" stroke-width="3"/></g>`; });
  // lamp posts
  [[350,470],[650,470]].forEach(([x,y]) => { s += `<circle cx="${x}" cy="${y-196}" r="60" fill="url(#gGlow)"/><rect x="${x-5}" y="${y-186}" width="10" height="186" fill="#8C1530"/><rect x="${x-9}" y="${y-20}" width="18" height="20" fill="url(#gGoldH)"/><path d="M${x-18} ${y-212} H${x+18} L${x+14} ${y-178} H${x-14} Z" fill="#FFF1C2" stroke="url(#gGold)" stroke-width="4"/><path d="M${x-22} ${y-212} L${x} ${y-232} L${x+22} ${y-212} Z" fill="url(#gGold)"/>`; });
  // snowy ground with drifts and a candy-cane fence
  s += '<path d="M0 470 C 150 452 300 476 500 462 C 700 450 860 476 1000 460 V700 H0 Z" fill="url(#gGround)"/>';
  for(let x=10;x<1000;x+=34){ if(x>250 && x<750) continue; s += `<path d="M${x} 506 V440 L${x+9} 426 L${x+18} 440 V506 Z" fill="url(#pCane)" stroke="#8C1530" stroke-width="1.5"/>`; }
  s += '<rect x="0" y="452" width="250" height="8" rx="4" fill="url(#gGoldH)"/><rect x="750" y="452" width="250" height="8" rx="4" fill="url(#gGoldH)"/>';
  s += '<path d="M0 520 C 140 496 260 530 400 512 C 560 494 700 528 840 508 C 920 498 970 506 1000 504 V700 H0 Z" fill="#FFFFFF"/>';
  s += '<path d="M0 520 C 140 496 260 530 400 512 C 560 494 700 528 840 508 C 920 498 970 506 1000 504" fill="none" stroke="#F2D3E2" stroke-width="4"/>';
  // little trees and presents in the snow
  const tree=(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-8" y="-20" width="16" height="20" fill="#8A5536"/><path d="M0 -150 L44 -96 L24 -96 L60 -48 L34 -48 L72 -14 L-72 -14 L-34 -48 L-60 -48 L-24 -96 L-44 -96 Z" fill="url(#gMint)" stroke="#2E9C7E" stroke-width="3" stroke-linejoin="round"/><path d="M0 -150 L16 -128 L-16 -128 Z M-44 -96 L-24 -96 L-30 -90 Z" fill="#fff"/><circle cx="-20" cy="-40" r="6" fill="#D6243A"/><circle cx="22" cy="-66" r="6" fill="#F3C969"/><circle cx="-8" cy="-100" r="5" fill="#F59AC0"/><circle cx="30" cy="-28" r="5" fill="#fff"/><use href="#tw" x="-14" y="-172" width="28" height="28"/></g>`;
  s += tree(90,600,1.1) + tree(920,610,1.15);
  const gift=(x,y,w,h,f,r)=>`<g filter="url(#fShadow)"><rect x="${x}" y="${y-h}" width="${w}" height="${h}" rx="4" fill="${f}" stroke="#8C1530" stroke-width="2"/><rect x="${x+w/2-5}" y="${y-h}" width="10" height="${h}" fill="${r}"/><rect x="${x}" y="${y-h/2-5}" width="${w}" height="10" fill="${r}"/><path d="M${x+w/2} ${y-h} c-12 -16 -28 -8 -20 2 z M${x+w/2} ${y-h} c12 -16 28 -8 20 2 z" fill="${r}" stroke="#8C1530" stroke-width="1.5"/></g>`;
  s += gift(160,640,60,46,"url(#gPink)","#F3C969") + gift(800,650,70,52,"url(#gMint)","#F59AC0") + gift(860,656,46,34,"url(#pCane)","#5FD6B3");
  for(let i=0;i<120;i++) s += `<circle cx="${R(0,1000).toFixed(0)}" cy="${R(530,700).toFixed(0)}" r="${R(.8,2.2).toFixed(1)}" fill="${Math.random()<.5?"#fff":"#E9D8F0"}"/>`;
  $("world").innerHTML = s;
  let f = ""; for(let i=0;i<70;i++){ const r=R(1.5,4), d=R(7,16); f += `<circle class="flake" cx="${R(0,1000).toFixed(0)}" cy="${R(-700,0).toFixed(0)}" r="${r.toFixed(1)}" fill="#fff" opacity="${R(.55,.95).toFixed(2)}" style="animation-duration:${d.toFixed(1)}s;animation-delay:-${R(0,d).toFixed(1)}s"/>`; }
  $("flakes").innerHTML = f;
})();

/* ===== Snowman parts ===== */
const HEAD={cx:500,cy:236,r:80}, MID={cx:500,cy:378,rx:114,ry:98}, BASE={cx:500,cy:540,rx:154,ry:120};
const PARTS = {
 hat: {label:"Hat", opts:[
  ["Top hat", () => `<g filter="url(#fShadow)"><ellipse cx="500" cy="176" rx="92" ry="17" fill="#1E1424"/><path d="M438 176 L444 74 Q500 62 556 74 L562 176 Z" fill="url(#gBlack)"/><ellipse cx="500" cy="74" rx="56" ry="11" fill="#3A2A42"/><rect x="440" y="140" width="120" height="22" fill="url(#gPink)"/><path d="M528 140 c14 -18 34 -8 26 6 c-6 10 -20 6 -26 -6 z M528 162 c14 18 34 8 26 -6" fill="url(#gPink)" stroke="#C4477A" stroke-width="1.5"/><path d="M450 86 q4 40 0 80" stroke="#fff" stroke-width="5" opacity=".18" fill="none"/></g>`],
  ["Santa hat", () => `<g filter="url(#fShadow)"><path d="M420 178 C 430 110 480 70 540 78 C 600 86 640 120 646 168 L 600 156 C 590 120 570 104 548 102 C 520 100 492 120 480 180 Z" fill="url(#gRed)"/><path d="M420 178 C 432 112 482 74 540 80 C 520 98 500 130 494 178 Z" fill="#E0405A" opacity=".5"/><circle cx="648" cy="172" r="22" fill="#FFFFFF" stroke="#E6DDEE" stroke-width="2"/><rect x="410" y="164" width="180" height="32" rx="16" fill="#FFFFFF" stroke="#E6DDEE" stroke-width="2"/></g>`],
  ["Bobble hat", () => `<g filter="url(#fShadow)"><path d="M424 190 C 424 120 462 90 500 90 C 538 90 576 120 576 190 Z" fill="url(#pKnit)" stroke="#2E9C7E" stroke-width="2.5"/><path d="M424 190 C 424 120 462 90 500 90 C 470 110 450 150 452 190 Z" fill="#fff" opacity=".18"/><rect x="418" y="172" width="164" height="28" rx="12" fill="url(#pCane)" stroke="#8C1530" stroke-width="2"/><circle cx="500" cy="84" r="24" fill="url(#gPink)"/><circle cx="492" cy="76" r="7" fill="#fff" opacity=".45"/></g>`],
  ["Crown", () => `<g filter="url(#fShadow)"><path d="M440 178 L432 104 L466 134 L500 92 L534 134 L568 104 L560 178 Z" fill="url(#gGold)" stroke="#9C6B22" stroke-width="3" stroke-linejoin="round"/><rect x="438" y="160" width="124" height="20" rx="4" fill="url(#gGoldH)" stroke="#9C6B22" stroke-width="2"/><circle cx="500" cy="170" r="7" fill="url(#gPink)"/><circle cx="466" cy="170" r="5" fill="url(#gMint)"/><circle cx="534" cy="170" r="5" fill="url(#gMint)"/><circle cx="432" cy="102" r="7" fill="#F59AC0"/><circle cx="500" cy="88" r="8" fill="#5FD6B3"/><circle cx="568" cy="102" r="7" fill="#F59AC0"/></g>`],
  ["Earmuffs", () => `<g filter="url(#fShadow)"><path d="M424 230 C 424 140 576 140 576 230" fill="none" stroke="url(#gGoldH)" stroke-width="10"/><circle cx="422" cy="236" r="30" fill="url(#gPink)"/><circle cx="578" cy="236" r="30" fill="url(#gPink)"/><circle cx="414" cy="226" r="9" fill="#fff" opacity=".45"/><circle cx="570" cy="226" r="9" fill="#fff" opacity=".45"/></g>`],
  ["Candy cap", () => `<g filter="url(#fShadow)"><path d="M428 186 C 440 120 500 100 560 120 C 610 140 640 110 650 80 C 668 110 640 160 576 186 Z" fill="url(#pCane)" stroke="#8C1530" stroke-width="2.5"/><circle cx="652" cy="78" r="20" fill="url(#gMint)"/><rect x="420" y="170" width="164" height="26" rx="12" fill="url(#gMint)"/></g>`],
  ["No hat", () => ``]]},
 scarf: {label:"Scarf", opts:[
  ["Cranberry", () => scarf("url(#gRed)","#7E0B20",true)],
  ["Peppermint", () => scarf("url(#pCane)","#8C1530",false)],
  ["Mint knit", () => scarf("url(#pKnit)","#2E9C7E",true)],
  ["Pink dots", () => scarf("url(#pDots)","#C4477A",false)],
  ["Gold", () => scarf("url(#gGold)","#9C6B22",true)],
  ["No scarf", () => ``]]},
 nose: {label:"Nose", opts:[
  ["Carrot", () => `<path d="M500 240 L572 252 L500 262 Z" fill="url(#gCarrot)" stroke="#C45A14" stroke-width="2" stroke-linejoin="round"/><path d="M520 246 l4 8 M538 248 l3 7" stroke="#C45A14" stroke-width="2"/>`],
  ["Peppermint", () => `<g transform="translate(500 250)"><circle r="16" fill="#FFF8EC" stroke="#B9848F" stroke-width="2"/>${[0,60,120,180,240,300].map(a=>`<path d="M0 0 C5 -5 12 -7 15 -5 C12 -12 5 -15 0 -16 Z" fill="#D6243A" transform="rotate(${a})"/>`).join("")}</g>`],
  ["Cherry", () => `<circle cx="500" cy="250" r="15" fill="url(#gRed)"/><circle cx="494" cy="244" r="5" fill="#fff" opacity=".6"/>`],
  ["Gumdrop", () => `<path d="M486 262 Q486 234 500 232 Q514 234 514 262 Z" fill="url(#gMint)"/><circle cx="496" cy="242" r="2" fill="#fff"/><circle cx="505" cy="250" r="2" fill="#fff"/>`]]},
 buttons: {label:"Buttons", opts:[
  ["Coal", () => btns(c => `<circle r="11" fill="url(#gCoal)"/>`)],
  ["Peppermints", () => btns(c => `<circle r="13" fill="#FFF8EC" stroke="#B9848F" stroke-width="1.5"/>${[0,60,120,180,240,300].map(a=>`<path d="M0 0 C4 -4 10 -6 12 -4 C10 -10 4 -12 0 -13 Z" fill="#D6243A" transform="rotate(${a})"/>`).join("")}`)],
  ["Gumdrops", () => btns((c,i) => `<path d="M-12 8 Q-12 -12 0 -13 Q12 -12 12 8 Z" fill="${["url(#gPink)","url(#gMint)","url(#gGold)"][i]}"/><circle cx="-3" cy="-4" r="2" fill="#fff"/>`)],
  ["Gold stars", () => btns(c => `<path d="M0 -14 L4 -4 L14 -4 L6 2 L9 12 L0 6 L-9 12 L-6 2 L-14 -4 L-4 -4 Z" fill="url(#gGold)" stroke="#9C6B22" stroke-width="1.5"/>`)],
  ["Hearts", () => btns(c => `<path d="M0 11 C-16 1 -12 -12 -5 -11 C-2 -10.5 0 -8 0 -6 C0 -8 2 -10.5 5 -11 C12 -12 16 1 0 11 Z" fill="url(#gRed)"/>`)]]},
 arms: {label:"Arms", opts:[
  ["Twigs", () => armsSVG("twig")],
  ["Candy canes", () => armsSVG("cane")],
  ["Mittens", () => armsSVG("mitten")]]},
 face: {label:"Face", opts:[
  ["Happy", () => face("happy")],
  ["Cheeky wink", () => face("wink")],
  ["Surprised", () => face("oh")],
  ["Rosy smile", () => face("rosy")]]},
 hold: {label:"Holding", opts:[
  ["Nothing", () => ``],
  ["Present", () => `<g filter="url(#fShadow)"><rect x="640" y="300" width="64" height="54" rx="4" fill="url(#gPink)" stroke="#8C1530" stroke-width="2"/><rect x="668" y="300" width="9" height="54" fill="#F3C969"/><rect x="640" y="322" width="64" height="9" fill="#F3C969"/><path d="M672 300 c-12 -16 -26 -8 -18 2 z M672 300 c12 -16 26 -8 18 2 z" fill="#F3C969" stroke="#8C1530" stroke-width="1.5"/></g>`],
  ["Lantern", () => `<g filter="url(#fShadow)"><circle cx="684" cy="330" r="46" fill="url(#gGlow)"/><path d="M684 270 V292" stroke="#8C1530" stroke-width="3"/><path d="M664 292 H704 L700 352 H668 Z" fill="#FFF1C2" stroke="url(#gGold)" stroke-width="4"/><path d="M660 292 L684 278 L708 292 Z" fill="url(#gGold)"/><path d="M684 312 C690 320 690 330 684 336 C678 330 678 320 684 312 Z" fill="#FFB24A"/></g>`],
  ["Broom", () => `<g filter="url(#fShadow)"><path d="M700 200 L660 470" stroke="url(#gWood)" stroke-width="10" stroke-linecap="round"/><path d="M640 450 L690 450 L700 540 L620 540 Z" fill="#E9C46A" stroke="#B98A2E" stroke-width="2"/><path d="M636 470 H692" stroke="#D6243A" stroke-width="6"/></g>`],
  ["Wreath", () => `<g filter="url(#fShadow)"><circle cx="690" cy="330" r="38" fill="none" stroke="url(#gMint)" stroke-width="20"/>${[0,60,120,180,240,300].map(a=>`<circle cx="${690+Math.cos(a*Math.PI/180)*38}" cy="${330+Math.sin(a*Math.PI/180)*38}" r="5" fill="#D6243A"/>`).join("")}<path d="M690 362 c-12 10 -22 22 -16 26 c6 2 12 -10 16 -20 c4 10 10 22 16 20 c6 -4 -4 -16 -16 -26 z" fill="url(#gRed)"/></g>`]]}
};
function scarf(fill, edge, fringe){ return `<g filter="url(#fShadow)"><path d="M418 300 C 450 330 550 330 582 300 L 588 330 C 552 362 448 362 412 330 Z" fill="${fill}" stroke="${edge}" stroke-width="2.5"/><path d="M566 322 C 580 372 588 414 584 446 L 550 450 C 552 418 546 378 536 334 Z" fill="${fill}" stroke="${edge}" stroke-width="2.5"/>${fringe ? [554,562,570,578].map(x=>`<path d="M${x} 449 v14" stroke="${edge}" stroke-width="3" stroke-linecap="round"/>`).join("") : ""}<path d="M430 312 C 470 332 530 332 570 312" stroke="#fff" stroke-width="4" opacity=".25" fill="none"/></g>`; }
function btns(f){ return [[340,0],[388,1],[440,2]].map(([y,i]) => `<g transform="translate(500 ${y})" filter="url(#fShadow)">${f(null,i)}</g>`).join(""); }
function armsSVG(kind){
  const L = kind==="cane" ? `<path d="M398 360 L300 300 L280 268 A16 16 0 0 1 306 252" fill="none" stroke="#8C1530" stroke-width="16" stroke-linecap="round"/><path d="M398 360 L300 300 L280 268 A16 16 0 0 1 306 252" fill="none" stroke="url(#pCane)" stroke-width="11" stroke-linecap="round"/>`
    : `<path d="M398 360 L290 290 M330 316 L310 276 M306 300 L270 296" stroke="url(#gWood)" stroke-width="9" stroke-linecap="round" fill="none"/>`;
  const Rr = kind==="cane" ? `<path d="M602 360 L700 300 L720 268 A16 16 0 0 0 694 252" fill="none" stroke="#8C1530" stroke-width="16" stroke-linecap="round"/><path d="M602 360 L700 300 L720 268 A16 16 0 0 0 694 252" fill="none" stroke="url(#pCane)" stroke-width="11" stroke-linecap="round"/>`
    : `<path d="M602 360 L710 290 M670 316 L690 276 M694 300 L730 296" stroke="url(#gWood)" stroke-width="9" stroke-linecap="round" fill="none"/>`;
  const mit = (x,y,flip) => `<g transform="translate(${x} ${y}) scale(${flip?-1:1} 1)"><path d="M-14 18 L-16 -2 C-17 -16 -6 -22 2 -20 C10 -18 12 -8 11 2 L16 -4 C19 -7 23 -4 21 0 L12 14 L12 18 Z" fill="url(#gRed)" stroke="#7E0B20" stroke-width="2"/><rect x="-16" y="13" width="30" height="9" rx="3" fill="#FFF8EC"/></g>`;
  return `<g id="armL" class="arm">${L}${kind==="mitten" ? mit(284,282,true) : ""}</g><g id="armR" class="arm">${Rr}${kind==="mitten" ? mit(716,282,false) : ""}</g>`;
}
function face(kind){
  const eyeL = kind==="wink" ? `<path d="M458 222 q12 -10 24 0" stroke="#1A1220" stroke-width="5" fill="none" stroke-linecap="round"/>` : `<circle cx="470" cy="222" r="${kind==="oh"?11:9}" fill="url(#gCoal)"/><circle cx="467" cy="218" r="3" fill="#fff"/>`;
  const eyeR = `<circle cx="530" cy="222" r="${kind==="oh"?11:9}" fill="url(#gCoal)"/><circle cx="527" cy="218" r="3" fill="#fff"/>`;
  const mouth = kind==="oh" ? `<ellipse cx="500" cy="284" rx="10" ry="12" fill="#3A2A42"/>` : [[462,272],[474,282],[488,288],[502,290],[516,288],[530,282],[540,272]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${kind==="rosy"?4:5}" fill="url(#gCoal)"/>`).join("");
  const cheeks = `<circle cx="448" cy="258" r="${kind==="rosy"?15:11}" fill="#F59AC0" opacity="${kind==="rosy"?.6:.4}"/><circle cx="552" cy="258" r="${kind==="rosy"?15:11}" fill="#F59AC0" opacity="${kind==="rosy"?.6:.4}"/>`;
  const brows = kind==="oh" ? `<path d="M456 200 q14 -8 28 0 M516 200 q14 -8 28 0" stroke="#5A4A60" stroke-width="3" fill="none" stroke-linecap="round"/>` : "";
  return `${cheeks}<g id="eyes">${eyeL}${eyeR}</g>${brows}${mouth}`;
}
const ORDER = ["hat","scarf","face","nose","buttons","arms","hold"];
const DEFAULT = {hat:0, scarf:0, nose:0, buttons:0, arms:0, face:0, hold:0};
let st = {...DEFAULT}; try{ const sv = JSON.parse(localStorage.getItem("candycanelane-day14-snowman-v1")||"null"); if(sv) st = Object.assign({...DEFAULT}, sv); }catch(e){}
function ball(c){ return `<ellipse cx="${c.cx}" cy="${c.cy}" rx="${c.rx||c.r}" ry="${c.ry||c.r}" fill="url(#gBall)"/><ellipse cx="${c.cx}" cy="${c.cy}" rx="${c.rx||c.r}" ry="${c.ry||c.r}" fill="url(#gRim)"/>`; }
function snowmanSVG(){
  const g = k => PARTS[k].opts[st[k]][1]();
  let s = `<ellipse cx="500" cy="652" rx="190" ry="26" fill="#9C7AB4" opacity=".35" filter="url(#fSoft)"/>`;
  s += `<g id="body">`;
  s += g("arms");
  s += ball(BASE) + `<ellipse cx="500" cy="452" rx="96" ry="16" fill="#B9AED6" opacity=".35" filter="url(#fSoft)"/>` + ball(MID) + `<ellipse cx="500" cy="300" rx="62" ry="12" fill="#B9AED6" opacity=".35" filter="url(#fSoft)"/>`;
  s += `<g opacity=".9">${[[430,560],[560,600],[520,480],[440,410],[575,365]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2" fill="#D6CCEA"/>`).join("")}</g>`;
  s += g("buttons");
  s += `<g id="headG">` + ball(HEAD) + g("face") + g("nose") + g("scarf") + g("hat") + `</g>`;
  s += g("hold");
  s += `</g>`;
  return s;
}
function draw(){ $("snowman").innerHTML = snowmanSVG(); try{ localStorage.setItem("candycanelane-day14-snowman-v1", JSON.stringify(st)); }catch(e){} }

/* ===== Controls ===== */
let tab = "hat";
function thumb(k,i){
  const keep = st[k]; st[k] = i; let inner;
  const view = {hat:"380 50 300 170", scarf:"390 280 220 200", nose:"440 200 150 90", buttons:"440 310 120 160", arms:"260 240 480 150", face:"420 180 160 130", hold:"600 190 160 360"}[k];
  if(k==="face" || k==="nose") inner = ball(HEAD) + PARTS.face.opts[k==="face"?i:st.face][1]() + PARTS.nose.opts[k==="nose"?i:st.nose][1]();
  else if(k==="buttons") inner = ball(MID) + PARTS.buttons.opts[i][1]();
  else if(k==="scarf") inner = ball(HEAD) + ball(MID) + PARTS.scarf.opts[i][1]();
  else if(k==="hat") inner = ball(HEAD) + PARTS.hat.opts[i][1]();
  else if(k==="arms") inner = ball(MID) + PARTS.arms.opts[i][1]();
  else inner = PARTS.hold.opts[i][1]() || `<text x="680" y="380" text-anchor="middle" font-size="60" fill="#C8A0A8" font-family="Georgia">&#215;</text>`;
  st[k] = keep;
  return `<svg viewBox="${view}" aria-hidden="true">${inner}</svg>`;
}
function renderTabs(){ $("tabs").innerHTML = ORDER.map(k => `<button class="tab" role="tab" aria-selected="${k===tab}" data-k="${k}">${PARTS[k].label}</button>`).join(""); document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.k; renderTabs(); renderOpts(); }); }
function renderOpts(){
  $("opts").innerHTML = PARTS[tab].opts.map((o,i) => `<button class="opt" aria-pressed="${st[tab]===i}" data-i="${i}">${thumb(tab,i)}${o[0]}</button>`).join("");
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => { st[tab] = +b.dataset.i; draw(); renderOpts(); puff(); });
}
function puff(){ for(let i=0;i<10;i++){ const a=Math.random()*Math.PI*2, d=40+Math.random()*90; const g=el("g",{transform:`translate(${R(420,580)} ${R(160,460)})`},$("fx")); el("use",{href:"#tw",x:-9,y:-9,width:18,height:18,class:"spark",style:`--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`},g); setTimeout(()=>g.remove(),1300); } }
$("randBtn").onclick = () => { ORDER.forEach(k => st[k] = Math.floor(Math.random()*PARTS[k].opts.length)); if(st.hat===PARTS.hat.opts.length-1 && Math.random()<.7) st.hat = 0; draw(); renderOpts(); puff(); };
$("resetBtn").onclick = () => { st = {...DEFAULT}; draw(); renderOpts(); };
const LINES = ["Hello, friend! Thank you for building me!", "Brrr-illiant! I love my outfit!", "Ho ho snow! Let’s play in the snow!", "I feel ever so frosty and fabulous!", "Merry Christmas from Candy Cane Lane!"];
let aliveT = null;
$("aliveBtn").onclick = () => {
  const r = $("stage").getBoundingClientRect(); if(r.top < 0 || r.bottom > innerHeight) $("stage").scrollIntoView({behavior: REDUCED ? "auto" : "smooth", block:"start"});
  const sm = $("snowman"); sm.classList.remove("alive"); void sm.getBBox(); sm.classList.add("alive");
  const nm = $("nameIn").value.trim();
  const line = LINES[Math.floor(Math.random()*LINES.length)];
  $("bubble").textContent = nm ? `I’m ${nm}! ${line}` : line; $("bubble").classList.add("on");
  for(let k=0;k<3;k++) setTimeout(puff, k*350);
  clearTimeout(aliveT); aliveT = setTimeout(() => { sm.classList.remove("alive"); $("bubble").classList.remove("on"); }, 4200);
};
$("saveBtn").onclick = () => {
  const svg = $("scene").cloneNode(true); svg.querySelector("#flakes").remove(); svg.querySelector("#fx").remove(); svg.setAttribute("xmlns", NS); svg.setAttribute("width", 2000); svg.setAttribute("height", 1400);
  const nm = $("nameIn").value.trim();
  if(nm){ const t = document.createElementNS(NS,"g"); t.innerHTML = `<rect x="320" y="18" width="360" height="56" rx="28" fill="#FFF8EC" stroke="#D9A94A" stroke-width="4"/><text x="500" y="56" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="32" fill="#8C1530">${nm.replace(/[<&>]/g,"")}</text>`; svg.appendChild(t); }
  const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); c.width = 2000; c.height = 1400; c.getContext("2d").drawImage(img,0,0,2000,1400);
    c.toBlob(b => { if(!b) return; const u=URL.createObjectURL(b), a=document.createElement("a"); a.href=u; a.download="My-Candy-Cane-Lane-Snowman.png"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }, "image/png"); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
};
draw(); renderTabs(); renderOpts();
window.__d14 = {st, PARTS, draw, ORDER};

})();
