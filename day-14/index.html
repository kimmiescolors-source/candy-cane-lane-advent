<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Day 14 · Shake-a-Snow-Globe · Candy Cane Lane</title>

<style>
:root{--cran:#8C1530;--red:#D6243A;--mint:#5FD6B3;--mintsoft:#DDF6EC;--mintdeep:#2E9C7E;--pink:#F7A8C4;--pinksoft:#FDE3EC;--ivory:#FFF8EC;--gold:#D9A94A;--ink:#4A2230}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--ink);font-family:Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(circle at 12% 18%,rgba(247,168,196,.25) 0 2px,transparent 3px) 0 0/46px 46px,radial-gradient(circle at 70% 60%,rgba(95,214,179,.22) 0 2px,transparent 3px) 0 0/58px 58px,var(--ivory)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 28px);box-shadow:0 2px 0 var(--pink)}
header{display:flex;align-items:center;gap:12px;max-width:1120px;margin:0 auto;padding:12px 16px 6px}
h1{flex:1;margin:0;text-align:center;color:var(--cran);font-weight:normal;font-size:clamp(20px,3.4vw,32px);line-height:1.15}
h1 small{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mintdeep);margin-bottom:3px}
.spacer{width:44px;flex:none}
.back{display:inline-flex;min-width:44px;justify-content:center;align-items:center;gap:6px;border:2px solid var(--cran);background:#fff;color:var(--cran);border-radius:999px;padding:9px 14px;font-size:15px;min-height:44px;white-space:nowrap}
.back:hover{background:var(--pinksoft)}
[hidden]{display:none !important}
.make{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:12px 28px;font-size:20px;color:#fff;background:linear-gradient(var(--red),var(--cran));box-shadow:0 5px 0 #5e0d20,0 10px 18px rgba(140,21,48,.3);min-height:58px}
.make:active{transform:translateY(3px);box-shadow:0 2px 0 #5e0d20}
.make.gold{color:#4A2230;background:linear-gradient(#F3C969,#C48A2C);box-shadow:0 5px 0 #8A5E1C,0 10px 18px rgba(169,119,42,.35)}
.make[disabled]{opacity:.5;cursor:default}
.small{min-height:48px;border-radius:999px;border:2px solid var(--cran);background:#fff;color:var(--cran);font-size:16px;padding:0 18px}
.small:hover{background:var(--pinksoft)}
.modal{position:fixed;inset:0;background:rgba(74,34,48,.5);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal.on{display:flex}
.modal .mcard{background:#fff;border-radius:20px;padding:22px;max-width:380px;text-align:center;box-shadow:0 0 0 4px var(--pink)}
.modal h2{color:var(--cran);font-weight:normal;margin:0 0 8px}
.modal button{min-height:48px;border-radius:999px;border:none;background:var(--cran);color:#fff;font-size:17px;padding:0 30px;margin-top:8px}
@media (max-width:820px){.back span{display:none}.back{padding:9px 12px}header{padding:10px 10px 4px}}


.wrap{max-width:1060px;margin:0 auto;padding:8px 14px 30px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.85fr);gap:22px;align-items:start}
.globeBox{position:relative;background:#fff;border-radius:26px;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink),0 0 0 10px var(--gold),0 18px 36px rgba(140,21,48,.2);overflow:hidden;touch-action:none}
#cv{display:block;width:100%;height:auto;aspect-ratio:800/900;cursor:grab}
.panel{background:#fff;border-radius:24px;padding:16px;box-shadow:0 0 0 3px var(--mintsoft),0 10px 24px rgba(46,156,126,.15)}
.panel h2{margin:0 0 4px;color:var(--cran);font-weight:normal;font-size:20px}
.panel .label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mintdeep);margin:14px 0 8px}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.ch{min-height:52px;border-radius:16px;border:none;background:var(--ivory);color:var(--cran);font-size:16px;padding:6px 14px;box-shadow:0 0 0 2px var(--pink)}
.ch[aria-pressed="true"]{background:var(--cran);color:#fff;box-shadow:0 0 0 2px var(--cran),0 4px 10px rgba(140,21,48,.25)}
.sw{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #e2c9cf;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--cran)}
.shake{width:100%;margin-top:18px;font-size:24px;min-height:66px}
.btns{display:grid;gap:10px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:999px;border:2px solid var(--cran);background:#fff;color:var(--cran);font-size:16px;width:100%}
.btn:hover{background:var(--pinksoft)}
.hint{font-size:14px;color:#7a5a63;font-style:italic;margin:10px 0 0;text-align:center}
@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:6px 10px 24px;gap:14px}.globeBox{max-width:460px;width:100%;margin:0 auto}}

</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <button class="back" id="backBtn" aria-label="Back to the Sweet Shop">&#8592; <span>Back to the Sweet Shop</span></button>
  <h1><small>Day 14 &middot; Candy Cane Lane</small>Shake-a-Snow-Globe Maker</h1>
  <div class="spacer"></div>
</header>

<div class="wrap">
  <div class="globeBox"><canvas id="cv" width="800" height="900" role="img" aria-label="Your Candy Cane Lane snow globe"></canvas></div>
  <section class="panel">
    <h2>Make your snow globe</h2>
    <div class="label">Inside the globe</div>
    <div class="choices" id="scenes">
      <button class="ch" data-v="shop" aria-pressed="true">The Sweet Shop</button>
      <button class="ch" data-v="pip" aria-pressed="false">Pip</button>
      <button class="ch" data-v="candy" aria-pressed="false">Candy</button>
      <button class="ch" data-v="captain" aria-pressed="false">Captain</button>
    </div>
    <div class="label">Base colour</div>
    <div class="choices" id="bases">
      <button class="sw" data-v="pink" style="background:#F59AC0" aria-label="Pink base" aria-pressed="true"></button>
      <button class="sw" data-v="mint" style="background:#5FD6B3" aria-label="Mint base" aria-pressed="false"></button>
      <button class="sw" data-v="cran" style="background:#B3122E" aria-label="Cranberry base" aria-pressed="false"></button>
      <button class="sw" data-v="gold" style="background:#E2B04E" aria-label="Gold base" aria-pressed="false"></button>
    </div>
    <div class="label">Snow</div>
    <div class="choices" id="snows">
      <button class="ch" data-v="snow" aria-pressed="true">Snowflakes</button>
      <button class="ch" data-v="gold" aria-pressed="false">Gold glitter</button>
      <button class="ch" data-v="pink" aria-pressed="false">Pink sparkles</button>
    </div>
    <button class="make gold shake" id="shakeBtn">&#10052; Shake it!</button>
    <p class="hint" id="hint">Tap &ldquo;Shake it!&rdquo;, swipe across the globe, or shake your phone.</p>
    <div class="btns"><button class="btn" id="saveBtn">Save my snow globe (PNG)</button></div>
  </section>
</div>

<div class="modal" id="backModal" role="dialog" aria-modal="true">
  <div class="mcard">
    <h2>Back to the Sweet Shop</h2>
    <p>Your Sweet Shop is still open in your other tab. Close this tab to go back to it.</p>
    <button id="backOk">OK</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ===== Safe return link (same rules as the other days) ===== */
const SHOP_URL = "";
const ALLOWED_RETURN_HOSTS = ["canva.site", "canva.com", "canva.link"];
const RETURN_KEY = "candycanelane-return-url";
function validReturnUrl(raw){
  try{
    if(!raw || raw.length>500) return null;
    const u = new URL(raw);
    if(u.protocol!=="https:" || u.username || u.password) return null;
    const h = u.hostname.toLowerCase();
    if(!ALLOWED_RETURN_HOSTS.some(a => h===a || h.endsWith("."+a))) return null;
    return u.href;
  }catch(e){ return null; }
}
function readParam(name){
  try{
    const q = new URLSearchParams(location.search).get(name);
    if(q) return q;
    return new URLSearchParams(location.hash.replace(/^#/,"")).get(name);
  }catch(e){ return null; }
}
function resolveReturnUrl(){
  const fromLink = validReturnUrl(readParam("return"));
  if(fromLink){ try{ localStorage.setItem(RETURN_KEY, fromLink); }catch(e){} return fromLink; }
  let fromRef = null;
  try{ if(document.referrer) fromRef = validReturnUrl(new URL(document.referrer).origin + "/"); }catch(e){}
  if(fromRef){ try{ if(!localStorage.getItem(RETURN_KEY)) localStorage.setItem(RETURN_KEY, fromRef); }catch(e){} }
  let remembered = null;
  try{ remembered = validReturnUrl(localStorage.getItem(RETURN_KEY)); }catch(e){}
  return remembered || fromRef || validReturnUrl(SHOP_URL);
}
const RETURN_URL = resolveReturnUrl();
const $ = id => document.getElementById(id);
$("backBtn").onclick = () => {
  if((window.opener||document.referrer)&&history.length<=1){ try{ window.close(); }catch(e){} setTimeout(function(){ if(RETURN_URL){ window.location.assign(RETURN_URL); } else { $("backModal").classList.add("on"); } },400); return; } if(RETURN_URL){ location.assign(RETURN_URL); return; }
  if(window.opener){ try{ window.close(); }catch(e){} }
  $("backModal").classList.add("on");
};
$("backOk").onclick = () => $("backModal").classList.remove("on");



const cv=$("cv"), ctx=cv.getContext("2d"), W=800, H=900, CX=400, CY=380, R=300, GROUND=560;
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const imgs = {}; const SRC = {pip:"../day-13/assets/pip.webp", candy:"../day-18/assets/candy.webp", captain:"../day-22/assets/captain.webp"};
for(const k in SRC){ const im = new Image(); im.onload = () => { dirty = true; }; im.src = SRC[k]; imgs[k] = im; }
const BASES = {pink:["#F7B3CB","#C4477A"], mint:["#7FDDBE","#2E9C7E"], cran:["#C8233F","#7E0B20"], gold:["#EDC56A","#A9772A"]};
const SNOWS = {snow:["#FFFFFF","#FFFFFF"], gold:["#FFE07A","#FFF6C9"], pink:["#FFB8D6","#FFFFFF"]};
const st = {scene:"shop", base:"pink", snow:"snow"};
let dirty = true, wobble = 0, wobT = 0;
function groundY(x){ const u=(x-CX)/R; return GROUND + u*u*70; }
const P = []; const N = 220;
function resetSnow(){ P.length=0; for(let i=0;i<N;i++){ const x = CX-R+40+Math.random()*(2*R-80); P.push({x, y: groundY(x)-2-Math.random()*6, vx:0, vy:0, r:1.6+Math.random()*2.6, rest:true, tw:Math.random()*6}); } }
resetSnow();
function shake(power){
  power = power || 1; wobble = REDUCED ? 0 : 14*power; wobT = 0;
  for(const p of P){ const a = Math.random()*Math.PI*2, s = (220+Math.random()*380)*power; p.vx = Math.cos(a)*s; p.vy = -Math.abs(Math.sin(a))*s - 120*power; p.rest = false; }
  dirty = true;
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function tree(x,y,s){ ctx.fillStyle="#9E6440"; ctx.fillRect(x-5*s,y-12*s,10*s,12*s); ctx.beginPath(); ctx.moveTo(x,y-90*s); ctx.lineTo(x+34*s,y-34*s); ctx.lineTo(x+18*s,y-34*s); ctx.lineTo(x+40*s,y-10*s); ctx.lineTo(x-40*s,y-10*s); ctx.lineTo(x-18*s,y-34*s); ctx.lineTo(x-34*s,y-34*s); ctx.closePath(); ctx.fillStyle="#5FD6B3"; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle="#2E9C7E"; ctx.stroke();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(x,y-90*s); ctx.lineTo(x+14*s,y-66*s); ctx.lineTo(x-14*s,y-66*s); ctx.closePath(); ctx.fill();
  [[-14,-28,"#D6243A"],[12,-44,"#F3C969"],[-6,-56,"#F59AC0"],[20,-18,"#fff"]].forEach(([dx,dy,c])=>{ ctx.beginPath(); ctx.arc(x+dx*s,y+dy*s,4*s,0,7); ctx.fillStyle=c; ctx.fill(); }); }
function star(x,y,r,fill){ ctx.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr2=i%2?r*.45:r; ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2); } ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle="#A9772A"; ctx.stroke(); }
function present(x,y,w,h,paper,rib){ ctx.fillStyle=paper; ctx.fillRect(x,y-h,w,h); ctx.strokeStyle="#8C1530"; ctx.lineWidth=2; ctx.strokeRect(x,y-h,w,h); ctx.fillStyle=rib; ctx.fillRect(x+w/2-4,y-h,8,h); ctx.fillRect(x,y-h/2-4,w,8); ctx.beginPath(); ctx.ellipse(x+w/2-8,y-h-6,9,6,-.4,0,7); ctx.ellipse(x+w/2+8,y-h-6,9,6,.4,0,7); ctx.fill(); }
function drawShop(){
  const x=280, y=GROUND+8, w=240, h=170;
  ctx.fillStyle="#F7B3CB"; rr(x,y-h,w,h,8); ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle="#8C1530"; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-22,y-h+4); ctx.lineTo(x+w/2,y-h-86); ctx.lineTo(x+w+22,y-h+4); ctx.closePath(); ctx.fillStyle="#8C1530"; ctx.fill();
  ctx.lineWidth=14; ctx.strokeStyle="#FFFFFF"; ctx.lineJoin="round"; ctx.beginPath(); ctx.moveTo(x-22,y-h+4); ctx.lineTo(x+w/2,y-h-86); ctx.lineTo(x+w+22,y-h+4); ctx.stroke();
  for(let i=0;i<8;i++){ ctx.fillStyle = i%2 ? "#FFF8EC" : "#D6243A"; ctx.beginPath(); ctx.moveTo(x+i*w/8,y-h+20); ctx.lineTo(x+(i+1)*w/8,y-h+20); ctx.lineTo(x+(i+1)*w/8,y-h+44); ctx.arc(x+(i+.5)*w/8,y-h+44,w/16,0,Math.PI); ctx.closePath(); ctx.fill(); }
  [[x+24,y-h+66],[x+w-84,y-h+66]].forEach(([wx,wy])=>{ ctx.fillStyle="#FFE9A8"; rr(wx,wy,60,52,10); ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle="#FFF8EC"; ctx.stroke(); ctx.beginPath(); ctx.arc(wx+18,wy+34,8,0,7); ctx.arc(wx+42,wy+30,8,0,7); ctx.fillStyle="#F59AC0"; ctx.fill(); });
  ctx.fillStyle="#5FD6B3"; rr(x+w/2-24,y-70,48,70,20); ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle="#2E9C7E"; ctx.stroke();
  ctx.beginPath(); ctx.arc(x+w/2,y-46,12,0,7); ctx.lineWidth=5; ctx.strokeStyle="#2E9C7E"; ctx.stroke();
  ctx.fillStyle="#FFF8EC"; rr(x+w/2-70,y-h-46,140,30,12); ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle="#D9A94A"; ctx.stroke();
  ctx.fillStyle="#8C1530"; ctx.font="italic 20px Georgia, serif"; ctx.textAlign="center"; ctx.fillText("Sweet Shop", x+w/2, y-h-24);
  tree(200,GROUND+20,1.05); tree(605,GROUND+20,.95);
}
function drawFigure(k, h, extra){
  const im = imgs[k]; if(!(im && im.naturalWidth)) return;
  const w = h*im.naturalWidth/im.naturalHeight; ctx.drawImage(im, CX-w/2, GROUND+16-h, w, h);
}
function drawScene(){
  // sky inside the globe
  const g = ctx.createLinearGradient(0,CY-R,0,GROUND); g.addColorStop(0,"#5B3F7E"); g.addColorStop(.6,"#C79BC8"); g.addColorStop(1,"#FBD9E4");
  ctx.fillStyle=g; ctx.fillRect(CX-R,CY-R,2*R,2*R);
  ctx.fillStyle="#fff"; for(let i=0;i<30;i++){ const x=CX-R+((i*97)%(2*R)), y=CY-R+30+((i*53)%200); ctx.globalAlpha=.6; ctx.beginPath(); ctx.arc(x,y,1.4,0,7); ctx.fill(); } ctx.globalAlpha=1;
  if(st.scene==="shop") drawShop();
  else if(st.scene==="pip"){ tree(250,GROUND+16,1.4); present(520,GROUND+18,56,44,"#F59AC0","#F3C969"); drawFigure("pip",250); }
  else if(st.scene==="candy"){ const gl=ctx.createRadialGradient(CX,200,10,CX,200,160); gl.addColorStop(0,"rgba(255,233,168,.9)"); gl.addColorStop(1,"rgba(255,233,168,0)"); ctx.fillStyle=gl; ctx.fillRect(CX-200,40,400,320); star(CX+110,190,40,"#F3C969"); drawFigure("candy",330); }
  else if(st.scene==="captain"){ present(240,GROUND+18,70,54,"#5FD6B3","#F59AC0"); present(500,GROUND+18,60,46,"#F59AC0","#F3C969"); present(548,GROUND+18,44,32,"#FFF8EC","#D6243A"); drawFigure("captain",330); }
  // snowy mound in front
  ctx.beginPath(); ctx.moveTo(CX-R,GROUND+70); for(let x=CX-R;x<=CX+R;x+=10) ctx.lineTo(x, groundY(x)+2); ctx.lineTo(CX+R,CY+R); ctx.lineTo(CX-R,CY+R); ctx.closePath(); ctx.fillStyle="#FFFDF8"; ctx.fill();
  ctx.beginPath(); for(let x=CX-R;x<=CX+R;x+=10) ctx.lineTo(x, groundY(x)+2); ctx.lineWidth=3; ctx.strokeStyle="#F2D6E0"; ctx.stroke();
}
function drawBase(){
  const [c,d] = BASES[st.base];
  ctx.fillStyle="rgba(74,34,48,.18)"; ctx.beginPath(); ctx.ellipse(CX,842,250,22,0,0,7); ctx.fill();
  const g=ctx.createLinearGradient(0,640,0,840); g.addColorStop(0,c); g.addColorStop(1,d);
  ctx.beginPath(); ctx.moveTo(CX-230,650); ctx.lineTo(CX+230,650); ctx.quadraticCurveTo(CX+250,760,CX+270,820); ctx.quadraticCurveTo(CX,850,CX-270,820); ctx.quadraticCurveTo(CX-250,760,CX-230,650); ctx.closePath(); ctx.fillStyle=g; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle=d; ctx.stroke();
  const gg=ctx.createLinearGradient(CX-260,0,CX+260,0); gg.addColorStop(0,"#A9772A"); gg.addColorStop(.35,"#F8DF94"); gg.addColorStop(.6,"#D9A94A"); gg.addColorStop(1,"#A9772A");
  ctx.fillStyle=gg; rr(CX-246,636,492,30,12); ctx.fill(); rr(CX-276,806,552,26,12); ctx.fill();
  ctx.fillStyle="#FFF8EC"; rr(CX-140,700,280,64,14); ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle="#D9A94A"; ctx.stroke();
  ctx.fillStyle="#8C1530"; ctx.textAlign="center"; ctx.font="italic 30px Georgia, serif"; ctx.fillText("Candy Cane Lane", CX, 744);
  [CX-190, CX+190].forEach(x => { ctx.save(); ctx.translate(x,732); ctx.beginPath(); ctx.arc(0,0,22,0,7); ctx.fillStyle="#FFF8EC"; ctx.fill(); ctx.fillStyle="#D6243A"; for(let i=0;i<6;i++){ ctx.rotate(Math.PI/3); ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(7,-7,16,-9,21,-7); ctx.bezierCurveTo(17,-16,8,-21,0,-22); ctx.closePath(); ctx.fill(); } ctx.restore(); });
}
function render(){
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(CX,CY,100,CX,CY,600); bg.addColorStop(0,"#FFF8EC"); bg.addColorStop(1,"#FDE3EC"); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  const off = wobble ? Math.sin(wobT*28)*wobble : 0;
  ctx.save(); ctx.translate(CX,800); ctx.rotate(off*0.004); ctx.translate(-CX + off,-800);
  drawBase();
  ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,R,0,7); ctx.clip();
  drawScene();
  const [sc, sc2] = SNOWS[st.snow];
  for(const p of P){ ctx.globalAlpha = st.snow==="snow" ? .95 : .7+.3*Math.sin(p.tw); ctx.fillStyle = p.r>3 ? sc2 : sc; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  // glass highlights
  const hl=ctx.createRadialGradient(CX-120,CY-150,10,CX-60,CY-80,R); hl.addColorStop(0,"rgba(255,255,255,.55)"); hl.addColorStop(.35,"rgba(255,255,255,.08)"); hl.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=hl; ctx.fillRect(CX-R,CY-R,2*R,2*R);
  const rim=ctx.createRadialGradient(CX,CY,R*.8,CX,CY,R); rim.addColorStop(0,"rgba(255,255,255,0)"); rim.addColorStop(1,"rgba(180,200,230,.45)"); ctx.fillStyle=rim; ctx.fillRect(CX-R,CY-R,2*R,2*R);
  ctx.restore();
  ctx.beginPath(); ctx.arc(CX,CY,R,0,7); ctx.lineWidth=6; ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.stroke(); ctx.lineWidth=2; ctx.strokeStyle="rgba(140,21,48,.25)"; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(CX-150,CY-170,60,22,-.7,0,7); ctx.fillStyle="rgba(255,255,255,.35)"; ctx.fill();
  ctx.restore();
}
function step(dt){
  let moving = false;
  if(wobble){ wobT += dt; wobble *= Math.pow(0.04, dt); if(wobble < .3) wobble = 0; moving = true; }
  for(const p of P){
    if(p.rest){ p.tw += dt*4; continue; }
    moving = true;
    p.vy += 150*dt; p.vx *= Math.pow(0.35, dt); p.vy *= Math.pow(0.45, dt);
    p.vx += Math.sin(p.y/40 + p.tw)*14*dt; p.tw += dt*4;
    p.x += p.vx*dt; p.y += p.vy*dt;
    const dx = p.x-CX, dy = p.y-CY, d = Math.hypot(dx,dy), lim = R-p.r-4;

    if(p.y >= gy && p.vy > 0){ p.y = gy - Math.random()*4; p.vx = 0; p.vy = 0; p.rest = true; }
  }
  return moving;
}
let last = 0;
function loop(now){

  const moving = step(dt);

}
requestAnimationFrame(loop);

function bindGroup(id, key){ document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => { st[key] = b.dataset.v; document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute("aria-pressed", x===b ? "true":"false")); dirty = true; if(key!=="base") shake(.6); }); }

// Device shaking (asks permission on iPhone the first time "Shake it!" is tapped)
let motionOn = false, lastShake = 0;
function onMotion(e){ const a = e.accelerationIncludingGravity || e.acceleration; if(!a) return; const m = Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0); const now = performance.now(); if(m > 32 && now-lastShake > 600){ lastShake = now; shake(1); } }
