<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Day 14 · Pip's Hide-and-Seek · Candy Cane Lane</title>

<style>
:root{--cran:#8C1530;--red:#D6243A;--mint:#5FD6B3;--mintsoft:#DDF6EC;--mintdeep:#2E9C7E;--pink:#F7A8C4;--pinksoft:#FDE3EC;--ivory:#FFF8EC;--gold:#D9A94A;--ink:#4A2230}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--ink);font-family:Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(circle at 12% 18%,rgba(247,168,196,.25) 0 2px,transparent 3px) 0 0/46px 46px,radial-gradient(circle at 70% 60%,rgba(95,214,179,.22) 0 2px,transparent 3px) 0 0/58px 58px,var(--ivory)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 28px);box-shadow:0 2px 0 var(--pink)}
header{display:flex;align-items:center;gap:12px;max-width:1120px;margin:0 auto;padding:12px 16px 6px}
h1{flex:1;margin:0;text-align:center;color:var(--cran);font-weight:normal;font-size:clamp(20px,3.4vw,32px);line-height:1.15}
h1 small{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mintdeep);margin-bottom:3px}
.spacer{width:44px;flex:none}
.back{display:inline-flex;min-width:44px;justify-content:center;align-items:center;gap:6px;border:2px solid var(--cran);background:#fff;color:var(--cran);border-radius:999px;padding:9px 14px;font-size:15px;min-height:44px;white-space:nowrap}
.back:hover{background:var(--pinksoft)}
[hidden]{display:none !important}
.make{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:12px 28px;font-size:20px;color:#fff;background:linear-gradient(var(--red),var(--cran));box-shadow:0 5px 0 #5e0d20,0 10px 18px rgba(140,21,48,.3);min-height:58px}
.make:active{transform:translateY(3px);box-shadow:0 2px 0 #5e0d20}
.make.gold{color:#4A2230;background:linear-gradient(#F3C969,#C48A2C);box-shadow:0 5px 0 #8A5E1C,0 10px 18px rgba(169,119,42,.35)}
.make[disabled]{opacity:.5;cursor:default}
.small{min-height:48px;border-radius:999px;border:2px solid var(--cran);background:#fff;color:var(--cran);font-size:16px;padding:0 18px}
.small:hover{background:var(--pinksoft)}
.modal{position:fixed;inset:0;background:rgba(74,34,48,.5);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal.on{display:flex}
.modal .mcard{background:#fff;border-radius:20px;padding:22px;max-width:380px;text-align:center;box-shadow:0 0 0 4px var(--pink)}
.modal h2{color:var(--cran);font-weight:normal;margin:0 0 8px}
.modal button{min-height:48px;border-radius:999px;border:none;background:var(--cran);color:#fff;font-size:17px;padding:0 30px;margin-top:8px}
@media (max-width:820px){.back span{display:none}.back{padding:9px 12px}header{padding:10px 10px 4px}}


.wrap{max-width:clamp(560px,calc((100vh - 340px) * 1.613 + 28px),1000px);margin:0 auto;padding:6px 14px 30px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 10px}
.levels{display:flex;gap:8px}
.lv{min-height:44px;border-radius:999px;border:none;background:var(--ivory);color:var(--cran);font-size:15px;padding:0 16px;box-shadow:0 0 0 2px var(--pink)}
.lv[aria-pressed="true"]{background:var(--cran);color:#fff;box-shadow:0 0 0 2px var(--cran)}
#sceneName{font-size:15px;color:var(--mintdeep);letter-spacing:.06em}
.stage{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink),0 0 0 10px var(--gold),0 18px 36px rgba(140,21,48,.2);background:#FDE3EC;touch-action:manipulation}
.stage svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.hit{cursor:pointer;fill:transparent}
.decoy{cursor:pointer}
.hiderImg{transition:transform .6s cubic-bezier(.2,1.4,.4,1)}
.ring{fill:none;stroke:#FFE07A;stroke-width:6;animation:ring 1s ease-in-out infinite}
@keyframes ring{0%,100%{opacity:.25}50%{opacity:1}}
.spark{animation:burst 1.1s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.say{margin:12px auto 0;max-width:720px;min-height:28px;text-align:center;font-size:clamp(16px,2.4vw,20px);font-style:italic;color:var(--cran)}
.tray{margin-top:10px;background:#fff;border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;box-shadow:0 0 0 3px var(--mintsoft),0 10px 24px rgba(46,156,126,.15)}
.ti{position:relative;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#7a5a63;text-align:center}
.ti .pic{width:60px;height:60px;border-radius:50%;background:var(--ivory) center 8%/cover no-repeat;box-shadow:0 0 0 3px var(--pink);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ti .pic svg{width:42px;height:42px}
.ti.found .pic{box-shadow:0 0 0 3px var(--mint)}
.ti.found::after{content:"\2713";position:absolute;top:-4px;right:4px;width:24px;height:24px;border-radius:50%;background:var(--mintdeep);color:#fff;font-size:15px;line-height:24px;font-weight:bold}
.ti.found{color:var(--mintdeep)}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:12px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,24,64,.3)}
.card{background:#fff;border-radius:24px;padding:20px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 0 3px var(--pinksoft),0 0 0 5px var(--gold),0 16px 32px rgba(0,0,0,.25)}
.card h2{margin:0 0 6px;color:var(--cran);font-weight:normal;font-size:clamp(22px,3.6vw,30px)}
.card p{margin:0 0 14px;font-size:clamp(15px,2.2vw,18px);line-height:1.4;font-style:italic}
@media (max-width:560px){.stage{border-radius:18px}.wrap{padding:4px 10px 24px}.ti{width:62px}.ti .pic{width:50px;height:50px}.lv{font-size:14px;padding:0 12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}

</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <button class="back" id="backBtn" aria-label="Back to the Sweet Shop">&#8592; <span>Back to the Sweet Shop</span></button>
  <h1><small>Day 14 &middot; Candy Cane Lane</small>Pip&rsquo;s Christmas Hide-and-Seek</h1>

<div class="wrap">

        <pattern id="pPinkG" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#F59AC0"/><circle cx="10" cy="10" r="3" fill="#F3D27A"/><circle cx="30" cy="28" r="3" fill="#fff" opacity=".8"/></pattern>
        <pattern id="pMintG" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#6FDDBB"/><circle cx="12" cy="12" r="2.5" fill="#fff"/><circle cx="30" cy="30" r="2.5" fill="#fff"/></pattern>
        <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8DF94"/><stop offset=".5" stop-color="#D9A94A"/><stop offset="1" stop-color="#A9772A"/></linearGradient>
        <linearGradient id="gGoldH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A9772A"/><stop offset=".35" stop-color="#F8DF94"/><stop offset=".6" stop-color="#D9A94A"/><stop offset="1" stop-color="#A9772A"/></linearGradient>
        <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6B488"/><stop offset="1" stop-color="#C98B5F"/></linearGradient>
        <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9BE93"/><stop offset="1" stop-color="#D29C6E"/></linearGradient>
        <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B3F7E"/><stop offset=".6" stop-color="#C79BC8"/><stop offset="1" stop-color="#F6C6D6"/></linearGradient>
        <linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B2D66"/><stop offset=".55" stop-color="#8E5E9E"/><stop offset="1" stop-color="#F3B3CB"/></linearGradient>
        <linearGradient id="gWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4C9"/><stop offset="1" stop-color="#FFC978"/></linearGradient>
        <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".3" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".4"/></linearGradient>
        <radialGradient id="gGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
        <radialGradient id="gHedge" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#A6EDD6"/><stop offset=".6" stop-color="#5FD6B3"/><stop offset="1" stop-color="#2E9C7E"/></radialGradient>
        <radialGradient id="gSnow" cx=".5" cy=".2" r=".9"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2DCE6"/></radialGradient>
        <filter id="fSoft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#8C1530" flood-opacity=".2"/></filter>
        <symbol id="tw" viewBox="-10 -10 20 20"><path d="M0 -10 C1 -3 3 -1 10 0 C3 1 1 3 0 10 C-1 3 -3 1 -10 0 C-3 -1 -1 -3 0 -10 Z" fill="#FFF3C4"/></symbol>
        <symbol id="t-star" viewBox="-25 -25 50 50"><path d="M0 -22 L6.5 -7 L22 -6.5 L10 4 L14 20 L0 11 L-14 20 L-10 4 L-22 -6.5 L-6.5 -7 Z" style="fill:var(--a,#F2C24E);stroke:var(--b,#A9772A)" stroke-width="2.5" stroke-linejoin="round"/><path d="M0 -22 L6.5 -7 L0 0 Z M22 -6.5 L10 4 L0 0 Z M-14 20 L-10 4 L0 0Z" fill="#fff" opacity=".45"/></symbol>
        <symbol id="t-pep" viewBox="-25 -25 50 50"><circle r="21" fill="#FFF8EC" stroke="#B9848F" stroke-width="2"/><g style="fill:var(--a,#D6243A)"><path id="pw" d="M0 0 C6 -6 15 -9 20 -6 C16 -15 7 -20 0 -21 Z"/><use href="#pw" transform="rotate(60)"/><use href="#pw" transform="rotate(120)"/><use href="#pw" transform="rotate(180)"/><use href="#pw" transform="rotate(240)"/><use href="#pw" transform="rotate(300)"/></g><circle r="4" fill="#FFF8EC"/></symbol>
        <symbol id="t-gift" viewBox="-25 -25 50 50"><rect x="-17" y="-10" width="34" height="28" rx="3" style="fill:var(--a,#5FD6B3)" stroke="#8C1530" stroke-width="2.2"/><rect x="-19" y="-16" width="38" height="9" rx="3" style="fill:var(--a,#5FD6B3)" stroke="#8C1530" stroke-width="2.2"/><rect x="-3.5" y="-16" width="7" height="34" style="fill:var(--b,#F59AC0)"/><path d="M0 -16 c-6 -10 -16 -6 -12 0 z M0 -16 c6 -10 16 -6 12 0 z" style="fill:var(--b,#F59AC0)" stroke="#8C1530" stroke-width="1.4"/></symbol>
        <symbol id="t-mitten" viewBox="-25 -25 50 50"><path d="M-12 18 L-14 -4 C-15 -16 -6 -22 2 -20 C10 -18 12 -8 11 2 L16 -4 C19 -7 23 -4 21 0 L12 14 L12 18 Z" style="fill:var(--a,#E0305A)" stroke="#5A2A2A" stroke-width="2.4" stroke-linejoin="round"/><rect x="-14" y="13" width="28" height="9" rx="3" fill="#FFF8EC" stroke="#5A2A2A" stroke-width="2"/><path d="M-6 -6 h10 M-7 2 h12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/></symbol>
        <symbol id="t-cane" viewBox="-25 -25 50 50"><path d="M-2 22 V-8 A9 9 0 0 1 16 -8 V-4" fill="none" stroke="#5A2A2A" stroke-width="11" stroke-linecap="round"/><path d="M-2 22 V-8 A9 9 0 0 1 16 -8 V-4" fill="none" stroke="#FFF8EC" stroke-width="7" stroke-linecap="round"/><path d="M-2 22 V-8 A9 9 0 0 1 16 -8 V-4" fill="none" style="stroke:var(--a,#D6243A)" stroke-width="7" stroke-dasharray="4 5"/></symbol>

      </defs>
      <g id="bg"></g>
      <g id="hiders"></g>
      <g id="fg"></g>
      <g id="decoys"></g>
      <g id="hits"></g>
      <g id="pop" pointer-events="none"></g>
      <g id="fx" pointer-events="none"></g>
    </svg>
    <div class="overlay" id="doneOv" hidden><div class="card">
      <h2>You found everyone!</h2>
      <p id="doneMsg">What a wonderful seeker you are!</p>
      <button class="make gold" id="againBtn">&#10022; Play again</button>
    </div></div>
  </div>
  <p class="say" id="say" aria-live="polite">Pip, Candy and Captain are hiding! Can you find them all?</p>

</div>

<div class="modal" id="backModal" role="dialog" aria-modal="true">
  <div class="mcard">
    <h2>Back to the Sweet Shop</h2>
    <p>Your Sweet Shop is still open in your other tab. Close this tab to go back to it.</p>
    <button id="backOk">OK</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ===== Safe return link (same rules as the other days) ===== */
const SHOP_URL = "";
const ALLOWED_RETURN_HOSTS = ["canva.site", "canva.com", "canva.link"];
const RETURN_KEY = "candycanelane-return-url";
function validReturnUrl(raw){
  try{
    if(!raw || raw.length>500) return null;
    const u = new URL(raw);
    if(u.protocol!=="https:" || u.username || u.password) return null;
    const h = u.hostname.toLowerCase();
    if(!ALLOWED_RETURN_HOSTS.some(a => h===a || h.endsWith("."+a))) return null;
    return u.href;
  }catch(e){ return null; }
}
function readParam(name){
  try{
    const q = new URLSearchParams(location.search).get(name);
    if(q) return q;
    return new URLSearchParams(location.hash.replace(/^#/,"")).get(name);
  }catch(e){ return null; }
}
function resolveReturnUrl(){
  const fromLink = validReturnUrl(readParam("return"));
  if(fromLink){ try{ localStorage.setItem(RETURN_KEY, fromLink); }catch(e){} return fromLink; }
  let fromRef = null;
  try{ if(document.referrer) fromRef = validReturnUrl(new URL(document.referrer).origin + "/"); }catch(e){}
  if(fromRef){ try{ if(!localStorage.getItem(RETURN_KEY)) localStorage.setItem(RETURN_KEY, fromRef); }catch(e){} }
  let remembered = null;
  try{ remembered = validReturnUrl(localStorage.getItem(RETURN_KEY)); }catch(e){}
  return remembered || fromRef || validReturnUrl(SHOP_URL);
}
const RETURN_URL = resolveReturnUrl();
const $ = id => document.getElementById(id);
$("backBtn").onclick = () => {
  if((window.opener||document.referrer)&&history.length<=1){ try{ window.close(); }catch(e){} setTimeout(function(){ if(RETURN_URL){ window.location.assign(RETURN_URL); } else { $("backModal").classList.add("on"); } },400); return; } if(RETURN_URL){ location.assign(RETURN_URL); return; }
  if(window.opener){ try{ window.close(); }catch(e){} }
  $("backModal").classList.add("on");
};
$("backOk").onclick = () => $("backModal").classList.remove("on");



const NS="http://www.w3.org/2000/svg";
function el(t,a,p){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; }
const R = (a,b) => a + Math.random()*(b-a);
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const O = {stroke:"#8C1530","stroke-width":2.5,"stroke-linejoin":"round"};

/* ===== Little drawing kit ===== */
function tree(g,x,y,s){ el("rect",{x:x-10*s,y:y-26*s,width:20*s,height:26*s,fill:"#9E6440"},g);
  el("path",Object.assign({d:`M${x} ${y-200*s} L${x+60*s} ${y-128*s} L${x+34*s} ${y-128*s} L${x+80*s} ${y-62*s} L${x+46*s} ${y-62*s} L${x+96*s} ${y-22*s} L${x-96*s} ${y-22*s} L${x-46*s} ${y-62*s} L${x-80*s} ${y-62*s} L${x-34*s} ${y-128*s} L${x-60*s} ${y-128*s} Z`,fill:"#5FD6B3"},O,{stroke:"#2E9C7E"}),g);
  [[-30,-50,"#D6243A"],[28,-80,"#F3C969"],[-14,-110,"#F59AC0"],[40,-44,"#C79BE0"],[-50,-40,"#F3C969"],[10,-150,"#D6243A"],[-26,-86,"#fff"]].forEach(([dx,dy,c])=>el("circle",{cx:x+dx*s,cy:y+dy*s,r:7*s,fill:c,stroke:"#8C1530","stroke-width":1.2},g));
  el("use",{href:"#t-star",x:x-22*s,y:y-226*s,width:44*s,height:44*s},g); }
function gift(g,x,y,w,h,paper,rib){ el("rect",Object.assign({x,y:y-h,width:w,height:h,rx:3,fill:paper},O),g); el("rect",{x:x+w/2-5,y:y-h,width:10,height:h,fill:rib},g); el("rect",{x,y:y-h/2-5,width:w,height:10,fill:rib},g);
  el("path",{d:`M${x+w/2} ${y-h} c-12 -16 -28 -8 -20 2 z M${x+w/2} ${y-h} c12 -16 28 -8 20 2 z`,fill:rib,stroke:"#8C1530","stroke-width":1.5},g); }
function jar(g,x,y,s,c){ el("rect",{x:x-22*s,y:y-60*s,width:44*s,height:60*s,rx:12*s,fill:"#FFFFFF",opacity:.55,stroke:"#B9848F","stroke-width":2},g);
  for(let i=0;i<5;i++) el("circle",{cx:x+R(-12,12)*s,cy:y-R(8,40)*s,r:7*s,fill:c},g);
  el("rect",{x:x-22*s,y:y-60*s,width:44*s,height:60*s,rx:12*s,fill:"url(#gGlass)"},g); el("rect",{x:x-16*s,y:y-70*s,width:32*s,height:12*s,rx:4,fill:"url(#gGold)"},g); }

  for(let k=0;k<L.decoys;k++){ const it = items.filter(i=>i.kind==="thing")[k % L.t]; let vi = Math.floor(Math.random()*4); if(vi===it.vi) vi = (vi+1)%4; want.push([it.sh, SHAPES[it.sh].v[vi]]); }
  for(let k=0;k<L.ginger;k++) want.push(["t-ginger", null]);
  want.forEach(([sh,v]) => { for(let tries=0; tries<30; tries++){ const z = zones[Math.floor(Math.random()*zones.length)], x = R(z[0]+20,z[1]-20), y = R(z[2],z[3]); if(!spotFree(x,y)) continue; placed.push([x,y]);
      const sz = sh==="t-ginger" ? L.sz*1.1 : L.sz*R(.85,1.05), u = el("use",{href:"#"+sh,x:x-sz/2,y:y-sz+4,width:sz,height:sz,style:v?vstyle(v):"",transform:`rotate(${R(-18,18).toFixed(1)} ${x} ${y-sz/2})`,class:"decoy"},$("decoys"));
      u.addEventListener("click", () => { const want = items.find(i => !i.found && i.kind==="thing" && i.sh===sh); say(sh==="t-ginger" ? "That\u2019s just a gingerbread cookie \u2013 Pip has a bow tie! Keep looking!" : want ? `Not quite \u2013 look for the ${want.name}!` : "Ooh, pretty! But that\u2019s not one we need."); });
      break; } });
  // generous invisible tap areas over each hiding place
  items.forEach((it,i) => { const r = el("rect",{class:"hit",x:it.hit.x-10,y:it.hit.y-10,width:it.hit.w+20,height:it.hit.h+20,rx:16,tabindex:0,role:"button","aria-label":"Something is hiding here"},$("hits"));
    r.addEventListener("click", () => find(i)); r.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); find(i); } }); it.hitEl = r; });
  renderTray();
  say({easy:"Pip, Candy and Captain are hiding! Find them and the three treasures in the tray \u2013 watch out for look-alikes!", tricky:"Tricky! Look for just a peek of Pip, Candy and Captain, and find the exact five treasures in the tray.", super:"Super Seeker! The tiniest peeks, six treasures and lots of look-alikes. Good luck!"}[level]);
}
function renderTray(){
  $("tray").innerHTML = items.map((it,i) => it.kind==="person"
    ? `<div class="ti ${it.found?"found":""}"><div class="pic" style="background-image:url('${it.p.src}')"></div>${it.p.name}</div>`
    : `<div class="ti ${it.found?"found":""}"><div class="pic"><svg viewBox="0 0 50 50" aria-hidden="true"><use href="#${it.sh}" width="50" height="50" style="${vstyle(it.v)}"/></svg></div>${it.name}</div>`).join("");
}
function say(t){ $("say").textContent = t; }
function sparkle(x,y,n,col){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, d=30+Math.random()*80; const g=el("g",{transform:`translate(${x} ${y})`},$("fx")); el("use",{href:"#tw",x:-9,y:-9,width:18,height:18,class:"spark",style:`--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;fill:${col||"#FFF3C4"}`},g); setTimeout(()=>g.remove(),1300); } }
function find(i){
  const it = items[i]; if(it.found) return; it.found = true; foundCount++;
  it.hitEl.remove(); $("fx").querySelectorAll(".ring").forEach(r=>r.remove());
  sparkle(it.cx, it.cy, REDUCED ? 6 : 18);
  if(it.kind==="person"){
    const round = roundId; it.img.removeAttribute("clip-path"); $("pop").appendChild(it.img);
    requestAnimationFrame(() => { it.img.style.transform = it.pop; }); say(it.p.found);
    setTimeout(() => { if(round!==roundId) return; it.img.style.transform = ""; setTimeout(() => { if(round!==roundId) return; $("hiders").appendChild(it.img); it.img.setAttribute("clip-path", `url(#${it.clip})`); }, REDUCED ? 0 : 600); }, REDUCED ? 600 : 1800);
  }
  else { it.img.style.transformBox = "fill-box"; it.img.style.transformOrigin = "50% 50%"; it.img.style.transition = "transform .5s cubic-bezier(.2,1.5,.4,1)"; it.img.style.transform = "translateY(-24px) scale(1.35)"; say(`You found the ${it.name}!`); }
  const b = el("g",{transform:`translate(${it.cx} ${it.hit.y - 6})`},$("hits")); el("circle",{r:15,fill:"#2E9C7E",stroke:"#fff","stroke-width":3},b); el("path",{d:"M-7 0 L-2 5 L7 -5",stroke:"#fff","stroke-width":3.5,fill:"none","stroke-linecap":"round"},b);
  renderTray();
  if(foundCount === items.length){ setTimeout(() => { $("doneMsg").textContent = level==="easy" ? "You found Pip, Candy, Captain and all the treasures! Ready for another hiding game?" : "Wow, you found every single one in Tricky mode! You’re a super seeker!"; $("doneOv").hidden = false; $("againBtn").focus(); }, 1200); }
}
function hint(){
  const left = items.filter(it => !it.found); if(!left.length) return;
  const it = left[Math.floor(Math.random()*left.length)];
  $("fx").querySelectorAll(".ring").forEach(r=>r.remove());
  el("circle",{class:"ring",cx:it.cx,cy:it.cy,r:{easy:110,tricky:130,super:150}[level]},$("fx"));
  say(it.kind==="person" ? `Psst… look near the twinkling circle for ${it.p.name}!` : `Psst… the ${it.t[1]} is near the twinkling circle!`);
}
document.querySelectorAll(".lv").forEach(b => { b.setAttribute("aria-pressed", b.dataset.lv===level ? "true":"false"); b.onclick = () => { level = b.dataset.lv; try{ localStorage.setItem("candycanelane-day14-level", level); }catch(e){} document.querySelectorAll(".lv").forEach(x=>x.setAttribute("aria-pressed", x===b ? "true":"false")); newRound(); }; });
$("hintBtn").onclick = hint; $("newBtn").onclick = newRound; $("againBtn").onclick = newRound;
newRound();
window.__d14 = {get items(){ return items; }, newRound, find, hint, SCENES, setScene(k){ lastScene = null; const keep = Object.keys(SCENES); SCENES.__force = k; }};

})();
</script>
