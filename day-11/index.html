<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Day 11 · Save the Snowman! · Candy Cane Lane</title>
<style>
:root{
  --cran:#8C1530; --red:#D6243A; --mint:#5FD6B3; --mintsoft:#DDF6EC; --mintdeep:#2E9C7E;
  --pink:#F7A8C4; --pinksoft:#FDE3EC; --ivory:#FFF8EC; --gold:#D9A94A; --ink:#4A2230;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--ink);font-family:Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:
  radial-gradient(circle at 12% 18%,rgba(247,168,196,.25) 0 2px,transparent 3px) 0 0/46px 46px,
  radial-gradient(circle at 70% 60%,rgba(95,214,179,.22) 0 2px,transparent 3px) 0 0/58px 58px,var(--ivory)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 28px);box-shadow:0 2px 0 var(--pink)}
header{display:flex;align-items:center;gap:12px;max-width:1120px;margin:0 auto;padding:12px 16px 4px}
h1{flex:1;margin:0;text-align:center;color:var(--cran);font-weight:normal;font-size:clamp(22px,3.6vw,34px);line-height:1.15}
h1 small{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mintdeep);margin-bottom:3px}
.spacer{width:44px;flex:none}
.back{display:inline-flex;min-width:44px;justify-content:center;align-items:center;gap:6px;border:2px solid var(--cran);background:#fff;color:var(--cran);border-radius:999px;padding:9px 14px;font-size:15px;min-height:44px;white-space:nowrap}
.back:hover{background:var(--pinksoft)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.levels{display:flex;gap:6px;background:#fff;border-radius:999px;padding:5px;box-shadow:0 0 0 3px var(--mintsoft),0 6px 16px rgba(46,156,126,.14);flex-wrap:wrap;justify-content:center;margin:4px auto 0;width:max-content;max-width:calc(100% - 20px)}
.levels button{border:none;background:transparent;border-radius:999px;padding:8px 14px;min-height:46px;color:var(--mintdeep);font-size:15px;line-height:1.1}
.levels button small{display:block;font-size:11px;letter-spacing:.06em;opacity:.85}
.levels button[aria-pressed="true"]{background:var(--cran);color:#fff}
main{max-width:1040px;margin:0 auto;padding:12px 14px 28px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:22px;align-items:start}
.scene{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--pink),0 14px 30px rgba(140,21,48,.18);background:#FDE3EC;aspect-ratio:400/340}
.scene svg{display:block;width:100%;height:100%}
.flakes{position:absolute;inset:0;pointer-events:none}
.flakes i{position:absolute;top:-10px;width:7px;height:7px;border-radius:50%;background:#fff;opacity:.9;box-shadow:0 0 3px rgba(255,255,255,.9);animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--drift),360px)}}
.lives{position:absolute;right:10px;top:54px;display:flex;gap:3px;background:rgba(255,255,255,.88);border-radius:999px;padding:5px 9px;box-shadow:0 0 0 2px var(--pink)}
.lives span{font-size:18px;line-height:1;transition:opacity .3s,transform .3s;color:var(--mintdeep)}
.lives span.off{opacity:.2;transform:scale(.8)}
.part{transition:transform .9s cubic-bezier(.3,.6,.4,1),opacity .9s ease;transform-box:fill-box;transform-origin:center}
.part.gone{opacity:0;transform:translate(var(--fx,0px),-70px) rotate(var(--fr,25deg)) scale(.8)}
#snowman.shiver{animation:shiver .5s ease}
@keyframes shiver{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
#snowman.dance{animation:dance .7s ease-in-out 3;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dance{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-4deg) translateY(-8px)}75%{transform:rotate(4deg) translateY(-8px)}}
.game{display:flex;flex-direction:column;gap:12px}
.how{margin:0;font-size:15px;line-height:1.35;color:#5b3a44}
.clue{background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 0 0 3px var(--mintsoft),0 8px 18px rgba(46,156,126,.12);font-size:18px;line-height:1.35}
.clueTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.clue b{font-weight:normal;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mintdeep)}
.mini{border:2px solid var(--cran);background:#fff;color:var(--cran);border-radius:999px;min-height:40px;padding:0 16px;font-size:15px;white-space:nowrap}
.mini:hover{background:var(--pinksoft)}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;min-height:60px;align-items:center;padding:4px 0}
.w{display:flex;gap:var(--g,5px)}
.t{width:var(--tw,40px);height:calc(var(--tw,40px)*1.12);border-bottom:4px solid var(--cran);display:flex;align-items:center;justify-content:center;font-size:calc(var(--tw,40px)*.72);color:var(--cran);background:rgba(255,255,255,.75);border-radius:8px 8px 3px 3px;font-weight:bold;font-family:Georgia,serif}
.t.show{animation:pop .35s ease}
.t.missed{color:var(--mintdeep)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.msg{min-height:24px;text-align:center;font-size:17px;color:var(--mintdeep);margin:0}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:7px}
.kb button{min-height:48px;border-radius:12px;border:2px solid var(--pink);background:#fff;color:var(--cran);font-size:21px;font-weight:bold;box-shadow:0 3px 0 var(--pink)}
.kb button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pink)}
.kb button.hit{background:var(--mint);border-color:var(--mintdeep);color:#fff;box-shadow:0 3px 0 var(--mintdeep)}
.kb button.miss{background:#f3e9ec;border-color:#e6d6db;color:#b89aa3;box-shadow:none;text-decoration:line-through}
.kb button:disabled{cursor:default}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.again{border:none;border-radius:999px;padding:10px 22px;min-height:48px;font-size:17px;color:#fff;background:linear-gradient(var(--red),var(--cran));box-shadow:0 4px 0 #5e0d20,0 8px 14px rgba(140,21,48,.25)}
.again:active{transform:translateY(2px);box-shadow:0 2px 0 #5e0d20}
.alt{border:2px solid var(--cran);background:#fff;color:var(--cran);border-radius:999px;min-height:48px;padding:0 20px;font-size:17px}
.overlay{position:fixed;inset:0;background:rgba(74,34,48,.42);display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
.overlay.on{display:flex}
.cele{background:var(--ivory);border-radius:26px;max-width:420px;width:100%;padding:22px;text-align:center;box-shadow:0 0 0 5px #fff,0 0 0 9px var(--pink),0 24px 50px rgba(0,0,0,.3);animation:rise .5s cubic-bezier(.3,.7,.3,1.3)}
@keyframes rise{from{transform:translateY(30px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.cele h2{margin:0 0 6px;color:var(--cran);font-weight:normal;font-size:28px}
.cele p{margin:0 0 8px;font-size:17px;line-height:1.4}
.cele .ans{font-size:24px;letter-spacing:.08em;color:var(--mintdeep);font-weight:bold}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(74,34,48,.5);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal.on{display:flex}
.modal .card2{background:#fff;border-radius:20px;padding:22px;max-width:380px;text-align:center;box-shadow:0 0 0 4px var(--pink)}
.modal h2{color:var(--cran);font-weight:normal;margin:0 0 8px}
.modal button{min-height:48px;border-radius:999px;border:none;background:var(--cran);color:#fff;font-size:17px;padding:0 30px;margin-top:8px}
@media (max-width:820px){
  main{grid-template-columns:1fr;gap:12px;padding:10px 10px 24px}
  .scene{width:100%;aspect-ratio:auto;height:clamp(140px,23svh,190px);background:
     radial-gradient(circle at 12.5px 22px,#D6243A 12px,transparent 12.5px) 0 0/50px 40px repeat-x,
     radial-gradient(circle at 37.5px 22px,#FFF8EC 12px,transparent 12.5px) 0 0/50px 40px repeat-x,
     repeating-linear-gradient(90deg,#D6243A 0 25px,#FFF8EC 25px 50px) 0 0/100% 22px no-repeat,
     linear-gradient(transparent 82%,#fff 82%),#FBD8E4}
  .lives{top:auto;bottom:8px;right:8px}
  .how{display:none}
  .word{min-height:48px}
  .kb{grid-template-columns:repeat(7,1fr);gap:6px}
}
@media (max-width:600px){
  .back span{display:none}
  .back{padding:9px 12px}
  header{padding:10px 10px 2px}
  .levels button{padding:7px 10px;font-size:14px}
  .clue{font-size:16px;padding:10px 14px}
  .how{font-size:14px}
}
@media (max-width:600px) and (max-height:700px){
  header h1 small{display:none}
  .scene{height:118px}
  .kb button{min-height:42px;font-size:19px}
  .kb{gap:5px}
  .clue{padding:8px 12px}
  .mini{min-height:36px}
}
@media (prefers-reduced-motion: reduce){
  .flakes{display:none}
  .part{transition:opacity .2s}
  .part.gone{transform:none}
  #snowman.shiver,#snowman.dance,.t.show,.cele{animation:none}
}
</style>
</head>

  <div class="game">
    <p class="how">Guess the Christmas word one letter at a time. Each wrong letter makes the snowman lose a piece of his outfit, so help him keep it on!</p>
    <div class="clue"><div class="clueTop"><b>Clue</b><button class="mini" id="againBtn">New word</button></div><span id="clue"></span></div>
    <div class="word" id="word" aria-label="The word"></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="kb" id="kb" role="group" aria-label="Letters"></div>
  </div>
</main>
<p class="sr" id="live" aria-live="polite"></p>

<div class="overlay" id="end" role="dialog" aria-modal="true" aria-labelledby="endTitle">
  <div class="cele">
    <h2 id="endTitle"></h2>
    <p id="endMsg"></p>
    <p class="ans" id="endAns"></p>
    <div class="row"><button class="again" id="endAgain">Play again</button><button class="alt" id="endLevel">Try a harder level</button></div>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="modal" id="backModal" role="dialog" aria-modal="true">
  <div class="card2">
    <h2>Back to the Sweet Shop</h2>
    <p>Your Sweet Shop is still open in your other tab. Close this tab to go back to it.</p>
    <button id="backOk">OK</button>
  </div>
</div>

<script>
(function(){
"use strict";
/* ===== Safe return link (same rules as the other Candy Cane Lane days) ===== */
const SHOP_URL = "";
const ALLOWED_RETURN_HOSTS = ["canva.site", "canva.com", "canva.link"];
const RETURN_KEY = "candycanelane-return-url";
function validReturnUrl(raw){
  try{
    if(!raw || raw.length>500) return null;
    const u = new URL(raw);
    if(u.protocol!=="https:" || u.username || u.password) return null;
    const h = u.hostname.toLowerCase();
    if(!ALLOWED_RETURN_HOSTS.some(a => h===a || h.endsWith("."+a))) return null;
    return u.href;
  }catch(e){ return null; }
}
function readParam(name){
  try{
    const q = new URLSearchParams(location.search).get(name);
    if(q) return q;
    return new URLSearchParams(location.hash.replace(/^#/,"")).get(name);
  }catch(e){ return null; }
}
function resolveReturnUrl(){
  const fromLink = validReturnUrl(readParam("return"));
  if(fromLink){ try{ localStorage.setItem(RETURN_KEY, fromLink); }catch(e){} return fromLink; }
  let fromRef = null;
  try{ if(document.referrer) fromRef = validReturnUrl(new URL(document.referrer).origin + "/"); }catch(e){}
  if(fromRef){ try{ if(!localStorage.getItem(RETURN_KEY)) localStorage.setItem(RETURN_KEY, fromRef); }catch(e){} }
  let remembered = null;
  try{ remembered = validReturnUrl(localStorage.getItem(RETURN_KEY)); }catch(e){}
  return remembered || fromRef || validReturnUrl(SHOP_URL);
}
const RETURN_URL = resolveReturnUrl();
const $ = id => document.getElementById(id);
$("backBtn").onclick = () => {
  if((window.opener||document.referrer)&&history.length<=1){ try{ window.close(); }catch(e){} setTimeout(function(){ if(RETURN_URL){ window.location.assign(RETURN_URL); } else { $("backModal").classList.add("on"); } },400); return; }
  if(RETURN_URL){ location.assign(RETURN_URL); return; }
  if(window.opener){ try{ window.close(); }catch(e){} }
  $("backModal").classList.add("on");
};
$("backOk").onclick = () => $("backModal").classList.remove("on");
const reduce = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ===== Word banks ===== */
const WORDS = {
 easy: [
  ["ELF","Santa's little helper in the toy workshop"],["BELL","It rings “jingle, jingle!”"],["STAR","It shines on top of the Christmas tree"],
  ["TREE","We hang lights and ornaments on it"],["SNOW","Cold, white flakes that fall from the sky"],["GIFT","Another word for a present"],
  ["SLED","Ride it down a snowy hill"],["BOW","A pretty ribbon tied on a present"],["HAT","Wear it on your head to stay warm"],
  ["TOY","Elves make these in Santa's workshop"],["JOY","A very happy feeling"],["COCOA","A warm chocolate drink"],
  ["CANDY","Sweet treats from the sweet shop"],["SANTA","He says “Ho, ho, ho!”"],["ANGEL","It can sit on top of the tree, with wings and a halo"],
  ["CAROL","A Christmas song we sing together"],["SCARF","Wrap it around your neck when it's cold"],["HOLLY","Green, prickly leaves with red berries"],
  ["ICE","Frozen water"],["WISH","Something you hope for very much"],["PINE","A tree with needles instead of leaves"],
  ["SING","What carollers do"],["FROST","Icy sparkles on the window on a cold morning"],["BAKE","What you do to cookies in the oven"],
  ["MINT","A cool, fresh candy flavour"],["GLOW","What Christmas lights do in the dark"],["CARD","Send one to say “Merry Christmas”"],
  ["FUDGE","A soft, sweet chocolate treat"]
 ],
 medium: [
  ["COOKIE","Leave one out for Santa with a glass of milk"],["WREATH","A ring of green leaves to hang on the door"],["MITTEN","It keeps your hand warm, with a spot for your thumb"],
  ["SLEIGH","Santa rides it across the sky"],["CANDLE","It glows with a tiny flame"],["TINSEL","Shiny, sparkly strands for the tree"],
  ["PRESENT","A wrapped-up gift"],["SNOWMAN","You're trying to save one right now!"],["WINTER","The coldest season of the year"],
  ["CHIMNEY","Santa slides down it on Christmas Eve"],["RIBBON","Tie it into a bow on a present"],["JINGLE","The sound little bells make"],
  ["GARLAND","A long decoration draped on the tree or the stairs"],["LIGHTS","Twinkly bulbs that glow on the tree"],["MERRY","“_____ Christmas!”"],
  ["ICICLE","A pointy piece of ice hanging from the roof"],["SWEATER","A warm, cosy top you pull over your head"],["ELVES","Santa's busy helpers (more than one!)"],
  ["SPARKLE","To shine and twinkle"],["TREAT","A yummy little goody"],["LANTERN","A little light you can carry"],
  ["SKATES","Wear them to glide across the ice"],["PENGUIN","A black-and-white bird that loves the cold"],["CHEER","A happy shout, like “Hooray!”"],
  ["FESTIVE","Happy and ready to celebrate"],["SNOWY","Covered in snow"]
 ],
 hard: [
  ["REINDEER","Animals that pull Santa's sleigh"],["STOCKING","Hang it up for Santa to fill with treats"],["ORNAMENT","A decoration you hang on the tree"],
  ["SNOWFLAKE","No two of these are exactly alike"],["GINGERBREAD","Spicy cookies shaped like houses and little people"],["CANDY CANE","A striped peppermint treat shaped like a hook"],
  ["NORTH POLE","Where Santa's workshop is"],["SNOWBALL","Pack it, roll it, then toss it gently!"],["FIREPLACE","Stockings hang above it"],
  ["PEPPERMINT","A cool, minty flavour of candy"],["MISTLETOE","A green plant with white berries hung in doorways"],["HOT CHOCOLATE","A warm drink topped with marshmallows"],
  ["CHRISTMAS TREE","Decorate it with lights and ornaments"],["SANTA CLAUS","He delivers presents on Christmas Eve"],["CHRISTMAS EVE","The night before Christmas"],
  ["SUGAR PLUM FAIRY","She dances in a famous Christmas ballet"],["NUTCRACKER","A wooden soldier who can crack nuts"],["SNOW ANGEL","Lie in the snow and sweep your arms and legs"],
  ["DECEMBER","The month Christmas comes in"],["WORKSHOP","Where the elves make toys"],["SLEIGH BELLS","They jingle as Santa flies by"],
  ["WRAPPING PAPER","Pretty paper for covering presents"],["ADVENT CALENDAR","Open one little door each day until Christmas!"],["SPRINKLES","Tiny colourful bits on top of icing"],
  ["ICE SKATING","Gliding across a frozen pond"],["MERRY CHRISTMAS","What we say on December 25"]
 ]
};
const NEXT = {easy:"medium", medium:"hard", hard:null};
const PARTS = ["pCane","pHat","pMitL","pMitR","pScarf","pButtons"];
const PART_NAMES = ["his candy cane","his hat","a mitten","his other mitten","his scarf","his buttons"];
const MAXW = 6;

/* ===== Fair randomness and a no-repeat word bag ===== */
function randInt(n){
  if(window.crypto && crypto.getRandomValues){
    const max = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1); let x;
    do{ crypto.getRandomValues(buf); x = buf[0]; }while(x >= max);
    return x % n;
  }
  return Math.floor(Math.random()*n);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=randInt(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const BAG_KEY = lv => "candycanelane-day11-bag-" + lv;
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const bags = {};
function nextWord(lv){
  const list = WORDS[lv], n = list.length;
  let b = bags[lv] || store.get(BAG_KEY(lv));
  if(!b || !Array.isArray(b.order) || b.order.length !== n || b.i >= n){
    const recent = (b && b.recent) || [];
    let order = shuffle([...Array(n).keys()]);
    // keep the last few words from showing up right at the start of the new round
    for(let tries=0; tries<20 && order.slice(0,3).some(i => recent.includes(i)); tries++) order = shuffle(order);
    b = {order, i:0, recent};
  }
  const idx = b.order[b.i++];
  b.recent = [idx].concat(b.recent || []).slice(0,3);
  bags[lv] = b; store.set(BAG_KEY(lv), b);
  return list[idx];
}

/* ===== Round state ===== */
let level = "easy", answer = "", clue = "", guessed = new Set(), wrong = 0, over = false, flakesOn = false;
const A_Z = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
function buildKeyboard(){
  $("kb").innerHTML = "";
  A_Z.forEach(L => { const b = document.createElement("button"); b.textContent = L; b.dataset.l = L; b.setAttribute("aria-label", "Letter " + L); b.onclick = () => guess(L); $("kb").appendChild(b); });
}
function lettersNeeded(){ return new Set(answer.replace(/[^A-Z]/g,"").split("")); }
function renderWord(revealAll){
  const w = $("word"); w.innerHTML = "";
  const words = answer.split(" ");
  const longest = Math.max(...words.map(x => x.length));
  const avail = Math.min(w.clientWidth || 360, 520);
  const gap = longest > 9 ? 4 : 6;
  const tw = Math.max(24, Math.min(46, Math.floor((avail - gap*(longest-1)) / longest)));
  w.style.setProperty("--tw", tw + "px");
  words.forEach(word => {
    const g = document.createElement("div"); g.className = "w"; g.style.setProperty("--g", gap + "px");
    word.split("").forEach(ch => {
      const t = document.createElement("span"); t.className = "t";
      const shown = guessed.has(ch);
      if(shown) t.textContent = ch;
      else if(revealAll){ t.textContent = ch; t.classList.add("missed"); }
      t.dataset.ch = ch;
      g.appendChild(t);
    });
    w.appendChild(g);
  });
  const shown = answer.split("").map(c => c===" " ? " " : (guessed.has(c) ? c : "blank")).join(" ");
  w.setAttribute("aria-label", `The word has ${answer.replace(/ /g,"").length} letters` + (words.length>1 ? ` in ${words.length} words` : "") + `: ${shown}`);
}
function renderLives(){
  const l = $("lives"); l.innerHTML = "";
  for(let i=0;i<MAXW;i++){ const s=document.createElement("span"); s.textContent="❄"; if(i < wrong) s.className="off"; l.appendChild(s); }
}
function setFace(mode){ // "happy" | "oops" | "brr" | "joy"
  $("eyesOpen").style.display = mode==="joy" ? "none" : "";
  $("eyesHappy").style.display = mode==="joy" ? "" : "none";
  $("brows").style.display = mode==="brr" ? "" : "none";
  $("mSmile").style.display = (mode==="oops"||mode==="brr") ? "none" : "";
  $("mO").style.display = (mode==="oops"||mode==="brr") ? "" : "none";
}
function newRound(){
  hideEnd();
  const [w, c] = nextWord(level); answer = w; clue = c;
  guessed = new Set(); wrong = 0; over = false;
  PARTS.forEach(id => $(id).classList.remove("gone"));
  $("snowman").classList.remove("dance","shiver"); setFace("happy");
  $("clue").textContent = clue; $("msg").textContent = "Tap a letter to guess the word!";
  buildKeyboard(); renderWord(false); renderLives();
  say(`New word. ${answer.replace(/ /g,"").length} letters. Clue: ${clue}`);
}
function guess(L){
  if(over || guessed.has(L)) return;
  guessed.add(L);
  const btn = $("kb").querySelector(`[data-l="${L}"]`);
  if(btn){ btn.disabled = true; }
  if(answer.includes(L)){
    if(btn) btn.classList.add("hit");
    const n = answer.split("").filter(c => c===L).length;
    renderWord(false);
    $("word").querySelectorAll(".t").forEach(t => { if(t.dataset.ch===L) t.classList.add("show"); });
    const praise = ["Great guess!","Yes!","You found it!","Sweet!","Well done!"][randInt(5)];
    $("msg").textContent = n > 1 ? `${praise} There are ${n} ${L}'s!` : praise;
    setFace("happy");
    say(`${L} is in the word${n>1?`, ${n} times`:""}.`);
    if([...lettersNeeded()].every(x => guessed.has(x))) win();
  } else {
    if(btn) btn.classList.add("miss");
    const part = PARTS[wrong], name = PART_NAMES[wrong];
    wrong++;
    $(part).classList.add("gone");
    const sm = $("snowman"); sm.classList.remove("shiver"); void sm.getBoundingClientRect(); sm.classList.add("shiver");
    setFace("oops"); setTimeout(()=>{ if(!over) setFace("happy"); }, 700);
    renderLives();
    const left = MAXW - wrong;
    $("msg").textContent = left > 0 ? `No ${L}. Oops, there goes ${name}! ${left} left.` : `No ${L}. Brrr!`;
    say(`No ${L}. The snowman lost ${name}. ${left} pieces left.`);
    if(wrong >= MAXW) lose();
  }
}
function win(){
  over = true; disableAll();
  $("snowman").classList.add("dance"); setFace("joy");
  setTimeout(()=>{
    $("endTitle").textContent = ["You saved the snowman!","Hooray, he's still cosy!","Snow-tastic!"][randInt(3)];
    $("endMsg").textContent = wrong === 0 ? "Perfect! He kept his whole outfit!" : `You solved it with ${MAXW - wrong} outfit piece${MAXW-wrong===1?"":"s"} to spare.`;
    $("endAns").textContent = answer;
    showEnd(true); confetti();
  }, reduce() ? 100 : 900);
  say(`You solved it! The word was ${answer}.`);
}
function lose(){
  over = true; disableAll(); setFace("brr");
  renderWord(true);
  setTimeout(()=>{
    $("endTitle").textContent = "Brrr! Time to warm up!";
    $("endMsg").textContent = "Good try! The snowman is ready for another word. The answer was:";
    $("endAns").textContent = answer;
    showEnd(false);
  }, reduce() ? 100 : 1000);
  say(`Good try. The word was ${answer}.`);
}
function disableAll(){ $("kb").querySelectorAll("button").forEach(b => b.disabled = true); }
function showEnd(won){
  const nx = NEXT[level];
  $("endLevel").style.display = (won && nx) ? "" : "none";
  $("end").classList.add("on"); $("endAgain").focus();
}
function hideEnd(){ $("end").classList.remove("on"); }
function say(t){ const l=$("live"); l.textContent=""; setTimeout(()=>{ l.textContent=t; },30); }

/* ===== Gentle falling snow ===== */
function makeFlakes(){
  if(reduce()) return;
  const f = $("flakes");
  for(let i=0;i<22;i++){ const s=document.createElement("i"); const sz=3+Math.random()*5;
    s.style.left=(Math.random()*100)+"%"; s.style.width=s.style.height=sz+"px";
    s.style.animationDuration=(6+Math.random()*7)+"s"; s.style.animationDelay=(-Math.random()*12)+"s"; s.style.setProperty("--drift",(Math.random()*40-20)+"px");
    f.appendChild(s); }
}
function confetti(){
  if(reduce()) return;
  const cv=$("confetti"), x=cv.getContext("2d"), dpr=Math.min(devicePixelRatio||1,2);
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#D6243A","#5FD6B3","#F7A8C4","#D9A94A","#FFFFFF","#8C1530"];
  const ps=Array.from({length:120},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*3,vr:(Math.random()-.5)*.2,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[randInt(cols.length)]}));
  const t0=performance.now();
  (function tick(t){ x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vy+=.03;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(t-t0<3400) requestAnimationFrame(tick); else x.clearRect(0,0,innerWidth,innerHeight); })(t0);
}

/* ===== Controls ===== */
function setLevel(lv){ level = lv; [...$("levels").children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.level===lv))); newRound(); }
$("levels").addEventListener("click", e => { const b = e.target.closest("button[data-level]"); if(b) setLevel(b.dataset.level); });
$("againBtn").onclick = newRound;
$("endAgain").onclick = newRound;
$("endLevel").onclick = () => { const nx = NEXT[level]; if(nx) setLevel(nx); };
document.addEventListener("keydown", e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if($("end").classList.contains("on")){ if(e.key==="Escape") hideEnd(); return; }
  if($("backModal").classList.contains("on")) return;
  const k = e.key.length===1 ? e.key.toUpperCase() : "";
  if(k >= "A" && k <= "Z"){ e.preventDefault(); guess(k); }
});
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => renderWord(over && wrong>=MAXW), 120); });

/* Test hooks for automated checks */
window.__sts = { state: () => ({level, answer, clue, wrong, over, guessed:[...guessed]}), guess: L => guess(L), start: lv => setLevel(lv), next: () => newRound(), words: WORDS };
makeFlakes();
newRound();
})();
</script>
</body>
</html>
