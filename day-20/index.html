<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Day 20 · Candy Cane Lane</title>
<link rel="stylesheet" href="../story/player.css">
</head>
<body data-day="20">
<div class="stripe"></div>
<header>
  <button class="back" id="backBtn" aria-label="Back to the Sweet Shop">&#8592; <span>Back to the Sweet Shop</span></button>
  <h1><small id="dayLabel">Day 20 · Candy Cane Lane</small><span id="storyTitle"></span></h1>
  <div class="spacer"></div>
</header>
<main>
  <div class="frame">
    <img id="cover" alt="" decoding="async">
    <button class="bigplay" id="bigPlay" aria-label="Play the story"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg></button>
  </div>
  <div class="controls">
    <button class="ctl" id="playBtn" aria-label="Play the story"></button>
    <div class="track">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Story progress">
      <div class="times"><span id="cur">0:00</span><span id="dur">–:––</span></div>
    </div>
    <button class="ctl small" id="replayBtn" aria-label="Replay from the beginning"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7.5 6 12 10V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
  <audio id="audio" preload="metadata"></audio>
</main>
<div class="modal" id="backModal" role="dialog" aria-modal="true">
  <div class="card">
    <h2>Back to the Sweet Shop</h2>
    <p>Your Sweet Shop is still open in your other tab. Close this tab to go back to it.</p>
    <button id="backOk">OK</button>
  </div>
</div>
<script src="../story/player.js"></script>
</body>
</html>
